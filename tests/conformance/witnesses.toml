# Conformance witness map (Stage 9a, invariant 42 — the coverage law).
#
# Maps a reference anchor to an EXISTING Rust test that exercises it, tagged `positive`
# (an accepting witness) or `negative` (a rejecting/producing witness). `delulu-conform
# --coverage` verifies every named test actually exists in the named file and is not
# `#[ignore]`d — a dangling or inactive witness is a coverage FAILURE (skip-branch rule).
#
# This file carries the witnesses that are Rust tests rather than `.delulu` conformance
# programs; conformance-header witnesses live in the `.delulu` files themselves.
#
# Schema (hand-parsed, strict): each [[witness]] table needs exactly anchor/file/test/kind.
#
# Curation rule: a witness must actually EXERCISE its anchor. A test that merely mentions a
# code in a string, or matches a JSON field that happens to share a subcommand's name, is not
# a witness. Entries here were read before they were written.

# ---- The soundness-audit rules (R-1..R-7). The laundering suite IS the audit's
# ---- exploit set, so each rule's rejecting side is a named test there.


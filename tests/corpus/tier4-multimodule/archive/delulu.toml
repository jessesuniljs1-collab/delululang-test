[package]
name = "archive"
version = "0.1.0"
kind = "lib"

# The only package in the pipeline with any authority at all, and it is one effect over one
# directory. A reader who wants to know what this program can do to their machine reads four
# manifests and is done — that is the property the split buys.
[authority]
effects  = ["Write"]
fs.write = ["./out"]

[dependencies]
reading = { path = "../reading", authority = { effects = [] } }

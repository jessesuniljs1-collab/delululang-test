[package]
name = "delulu-runtime"
description = "DeluluLang runtime: values, capability table, Stage-1 grant broker, tree-walking interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# NOT a crates.io library. `STABILITY.md` §2: the Rust crates are an implementation
# detail; the stable interface is the language, the CLI and the machine schemas. Only the CLI is
# publishABLE -- and it is not actually publishABLE in practice: `cargo publish -p delulu` fails
# with "all dependencies must have a version requirement specified when publishing", because it
# depends on crates like this one by `path` alone. That is exactly the argument `INSTALL.md`
# section 3 makes for why `cargo install delulu` from crates.io is not offered, and
# `tests/distribution.rs` pins it from both sides. (This comment previously claimed
# "`cargo install delulu` works", which contradicted INSTALL.md -- corrected in campaign P17-F
# after verifying the failure with `--dry-run`.) Distribution is the archive from
# `scripts/package-toolchain.sh`; from source, `cargo install --path crates/delulu`.
publish = false

[package.metadata.delulu]
# Part of the language product: what a user of DeluluLang runs or depends on.
surface = "language"

[features]
# Embedded CPython (Stage 4 phase 4f, spec §5). ENABLED BY DEFAULT — a normal build of delulu
# includes Python; `--no-default-features` builds a Python-less runtime where `root.python(...)`
# returns `ForeignErr::Unavailable` (DL1307), the same user-visible behaviour as no interpreter.
# All PyO3 code is isolated behind `#[cfg(feature = "python")]` in `src/python.rs`.
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
delulu-diag = { path = "../delulu-diag" }
delulu-syntax = { path = "../delulu-syntax" }
delulu-check = { path = "../delulu-check" }
# Stage 5 chunk 3 (phase 5f): the `Custody` trait reuses the broker's `Op` classification and its
# `Snapshot` validator so the embedded and daemon paths share ONE policy core (no duplication).
# delulu-broker depends only on delulu-diag/delulu-check, so this adds no cycle.
delulu-broker = { path = "../delulu-broker" }
# Stage 6 (Live): the `.dpx` plugin manifest is JSON, so the loader reads its ceiling/exports out of
# a `serde_json::Value` (the container itself is parsed above this crate — see `plugin.rs` topology).
serde_json = { workspace = true }
# Stage 6 (Live) phase 6h: ed25519 plugin signatures (spec §2.2/§3.1 step 6). House rule 5 pre-approves
# ed25519-dalek v2 — cryptography is NEVER hand-rolled. Verification (load step 6) and signing (the
# `plugin build --sign` helper) share ONE message-construction path here, so verify never drifts from
# sign. Default features only (no rng: keys are supplied as raw 32-byte seeds, never generated here).
ed25519-dalek = "2"
# Stage 10 phase 10i (Track G, ruling D14) — vetted RustCrypto lattice implementations, adopted
# rather than written. Both carry their own "never been independently audited" warning, which is
# why post-quantum signing ships behind `--unstable` (DL1910) rather than as a stable path.
# Versions are pinned EXACTLY (`=`), not caret-ranged, because "we vetted 0.1.1" is a claim about a
# specific set of bytes. A caret range would let an unaudited lattice implementation change under a
# recorded vetting without anyone re-reading it (ruling S10-D14c).
#
# This comment used to justify the pins by saying `Cargo.lock` was gitignored. That stopped being
# true at S10-D19c, which committed the lockfile — and the correction matters, because the two
# facts do different work. A lockfile binds THIS build; a `=` requirement binds every consumer that
# depends on this crate and survives `cargo update`. The pins were right for a reason that outlived
# the reason originally given for them. (Found by the Survey: `docs/survey/`.)
ml-dsa = { version = "=0.1.1", features = ["zeroize"] }
ml-kem = { version = "=0.3.2", features = ["zeroize"] }
# Stage 4 C FFI (spec §4). `libloading` binds a shared library; `libffi` assembles the call because
# a foreign signature is runtime data. Both are isolated behind `src/foreign.rs`.
libloading = "0.8"
libffi = "3"
# Stage 4 embedded CPython (spec §5). PyO3 with `auto-initialize` OFF (the interpreter is prepared
# lazily on the first grant-checked `root.python(...)` call). Isolated behind `src/python.rs` and the
# `python` feature. Optional so `--no-default-features` builds a Python-less delulu.
pyo3 = { version = "0.25", optional = true }

# macOS links the SYSTEM libffi instead of compiling the copy `libffi-sys` vendors (libffi 3.4.4),
# whose aarch64 assembly current Apple clang rejects — "invalid CFI advance_loc expression" in
# `src/aarch64/sysv.S` — which stopped the macOS build before any DeluluLang source compiled. Found
# by the first CI run (2026-09-14, run 34830053479). With `system`, libffi-sys builds nothing and
# emits only `-lffi`; macOS ships libffi as a system library, and whether it links and runs is what
# the next macOS run tests. Target-scoped (resolver 2): Windows and Linux still build the vendored
# copy exactly as before, and Cargo.lock does not change.
[target.'cfg(target_os = "macos")'.dependencies]
libffi = { version = "3", features = ["system"] }

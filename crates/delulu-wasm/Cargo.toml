[package]
name = "delulu-wasm"
description = "DeluluLang WASM backend (Stage 3): compile checked programs to WebAssembly and run them under an embedded, deny-by-default Wasmtime host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# NOT a crates.io library. `STABILITY.md` §2: the Rust crates are an implementation
# detail; the stable interface is the language, the CLI and the machine schemas. Only the CLI is
# publishABLE -- and it is not actually publishABLE in practice: `cargo publish -p delulu` fails
# with "all dependencies must have a version requirement specified when publishing", because it
# depends on crates like this one by `path` alone. That is exactly the argument `INSTALL.md`
# section 3 makes for why `cargo install delulu` from crates.io is not offered, and
# `tests/distribution.rs` pins it from both sides. (This comment previously claimed
# "`cargo install delulu` works", which contradicted INSTALL.md -- corrected in campaign P17-F
# after verifying the failure with `--dry-run`.) Distribution is the archive from
# `scripts/package-toolchain.sh`; from source, `cargo install --path crates/delulu`.
publish = false

[package.metadata.delulu]
# Part of the language product: what a user of DeluluLang runs or depends on.
surface = "language"

[dependencies]
delulu-diag = { path = "../delulu-diag" }
delulu-syntax = { path = "../delulu-syntax" }
delulu-check = { path = "../delulu-check" }
# Stage 4 phase 4g: the WASM host reuses the interpreter's C FFI machinery (`foreign::{ForeignSig,
# load_and_resolve, call, FVal, ForeignErr}`) and its `TraceSink`/`TraceRecord`, so verify≡run stays
# one code path. `default-features = false` keeps embedded Python out of the WASM crate (py.* on the
# WASM backend is the DL1201 interpreter fallback — phase 4g, head-chef ruling).
delulu-runtime = { path = "../delulu-runtime", default-features = false }
wasm-encoder = "0.221"
# Stage 6 (Live) 6f.2: the trap-attribution core downcasts Wasmtime's boxed error to `Trap` and
# builds honest `Unattributable` messages. `anyhow` is already compiled in-tree (a transitive dep of
# wasmtime), so making it a DIRECT dep adds no new build — recorded as build-order deviation 6.
anyhow = "1"
# Default features (incl. signals-based traps) so host-function errors unwind cleanly rather than
# aborting the process — correctness over build size.
wasmtime = "47"
# The `.dwx` artifact embeds its authority manifest (serde_json) and binds it to the code with a
# content hash (blake3) so the manifest and the bytes it describes can't drift apart undetected.
serde_json = { workspace = true }
blake3 = "1"

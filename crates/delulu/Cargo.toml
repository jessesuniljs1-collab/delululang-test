[package]
name = "delulu"
description = "The DeluluLang CLI: check | run | repl | authority"
version.workspace = true
edition.workspace = true

[[bin]]
name = "delulu"
path = "src/main.rs"

[features]
# Forward the runtime's embedded-Python feature (Stage 4 phase 4f). ON by default so a normal
# `cargo build`/`cargo test --workspace` produces a Python-capable `delulu`; build the CLI with
# `--no-default-features` for a Python-less binary.
default = ["python"]
python = ["delulu-runtime/python"]

[dependencies]
delulu-diag = { path = "../delulu-diag" }
delulu-syntax = { path = "../delulu-syntax" }
delulu-check = { path = "../delulu-check" }
delulu-runtime = { path = "../delulu-runtime", default-features = false }
delulu-wasm = { path = "../delulu-wasm" }
# Stage 5 chunk 2 (phase 5d): `delulu audit tail|query|verify` reads the hash-chained log files
# directly — no daemon involved (the daemon is chunk 3).
delulu-broker = { path = "../delulu-broker" }
serde_json = { workspace = true }

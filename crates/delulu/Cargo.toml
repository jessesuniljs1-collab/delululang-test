[package]
name = "delulu"
description = "The DeluluLang CLI: check | run | repl | authority"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# DELIBERATELY the only crate WITHOUT `publish = false`, and that is load-bearing rather than an
# oversight: `INSTALL.md` §3's argument is that `cargo install delulu` from crates.io cannot work
# *because* the CLI's eight sibling dependencies are all `publish = false` and carry no version
# requirement. `tests/distribution.rs` pins the posture from both sides — one test asserts exactly
# one crate is publishable, another asserts no document ever PROMISES that install path.
#
# Verified rather than assumed (P17-F): `cargo publish -p delulu --dry-run` fails with
#   "all dependencies must have a version requirement specified when publishing"
# which is precisely the state §3 describes. Publishable in posture, unpublishable in fact, and
# documented as such. Distribution is `scripts/package-toolchain.sh`; from source it is
# `cargo install --path crates/delulu`.

[package.metadata.delulu]
# Part of the language product: what a user of DeluluLang runs or depends on.
surface = "language"

[[bin]]
name = "delulu"
path = "src/main.rs"

# Stage 5 phase 5i: `delulu_kvm` gates the criterion-8 microVM egress-deny test — set it only on a
# Linux CI runner with KVM + a provisioned microVM runtime (`RUSTFLAGS="--cfg delulu_kvm"`).
# Registered here so the gate is clippy-clean everywhere else.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(delulu_kvm)"] }

[features]
# Forward the runtime's embedded-Python feature (Stage 4 phase 4f). ON by default so a normal
# `cargo build`/`cargo test --workspace` produces a Python-capable `delulu`; build the CLI with
# `--no-default-features` for a Python-less binary.
default = ["python", "net"]
python = ["delulu-runtime/python"]
# PS-B-02: the egress client (D-V2-30). Forwarded, and default, for the same reason `python` is: this
# crate takes the runtime with `default-features = false`, so a runtime feature that is not forwarded
# here reaches the binary only when some OTHER workspace member happens to enable it. That was the
# state of the tree when the dependency landed: a workspace build had a network client and
# `cargo install --path crates/delulu` did not, and nothing said so.
#
# `--no-default-features` therefore drops BOTH, which is why the portable release build names this
# one back explicitly (`scripts/package-toolchain.sh`: `--no-default-features --features net`) --
# Python is left out of the download for a portability reason, and networking has no such reason.
# `tests/distribution.rs` pins that line.
net = ["delulu-runtime/net"]

[dependencies]
delulu-diag = { path = "../delulu-diag" }
delulu-syntax = { path = "../delulu-syntax" }
delulu-check = { path = "../delulu-check" }
delulu-atlas = { path = "../delulu-atlas" }
delulu-runtime = { path = "../delulu-runtime", default-features = false }
# PS-A-03: the sandbox guest verifies the program hash the host sent. blake3 is already used by
# delulu-broker, delulu-check and delulu-wasm — the same dependency, not a new one.
blake3 = "1"
delulu-wasm = { path = "../delulu-wasm" }
# Stage 5 chunk 2 (phase 5d): `delulu audit tail|query|verify` reads the hash-chained log files
# directly. Chunk 3 (phases 5f/5g): the daemon owns a `Broker` + `AuditLog` + secret store; the
# client speaks IPC to it.
delulu-broker = { path = "../delulu-broker" }
# `delulu doctor`'s repository section. The Survey is repository tooling, so this is the one place
# the shipped CLI links something that only means anything inside the DeluluLang source tree —
# doctor detects that tree and skips the section elsewhere, rather than reporting on a checkout it
# is not standing in. Accepted for a real reason: "is my checkout healthy?" should be ONE command,
# not one for the environment and another for the map. The cost is honest and small — the Survey
# has no third-party dependencies of its own, so the SBOM is unchanged and only ~2k lines of
# dependency-free Rust are linked in. Note the direction: nothing in the Survey depends on the
# compiler, which is what keeps the map readable when the tree does not build.
delulu-survey = { path = "../delulu-survey" }
serde_json = { workspace = true }
serde = { workspace = true }
# Stage 8 phase 8h: `delulu keygen` mints an ed25519 signing seed from OS randomness.
# getrandom 0.3 is already the workspace's randomness source (delulu-broker ruling 3) — reused,
# not a new dependency. The ed25519 primitives themselves live in delulu-runtime (house rule 5).
getrandom = "0.3"
# Chunk 3 wire protocol (head-chef ruling 2): length-prefixed canonical CBOR frames. ciborium is
# pure-Rust and serde-based, so the fixed-field request/response structs encode deterministically.
ciborium = "0.2"
# Surface morphs (Stage 8 §6.5): a morph is a TOML keyword table. Already the workspace's manifest
# parser (delulu-check) and already an SBOM component — no new supply-chain surface, and the same
# "parsed as a pure function of its text; no code runs at load time" property applies.
toml = "0.8"

# Windows named-pipe transport + peer identity (phase 5f), plus the foreign-worker Job Object
# (phase 5h: JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE). windows-sys is already in the workspace dep tree
# via wasmtime; we reuse it rather than adding winapi.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    # PS-A-04: resume a suspended guest after its jail is applied (thread snapshot).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    # PS-B-01: the budget watchdog reads this process's peak commit (`K32GetProcessMemoryInfo`).
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Security_Authorization",
    # PS-B-03: the per-run AppContainer (`identity.rs`) and the runtime copy's module list.
    "Win32_Security_Isolation",
    "Win32_System_LibraryLoader",
] }

# Foreign-worker kill-on-host-death on Linux (phase 5h): prctl(PR_SET_PDEATHSIG) — a Linux-only
# syscall (libc defines it for Linux/Android, not Apple/BSD; gating this cfg(unix) breaks macOS).
# libc is the single most standard Rust FFI crate; seccomp is a documented post-chunk stub (ruling 4).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# PS-A-04: the guest installs a seccomp filter on itself once it has connected — no new programs, no
# debugger, no namespace or kernel-module tricks. Apache-2.0 or BSD-3-Clause, both on deny.toml's
# allowlist, and approved by the owner in D-V2-25 (D-NE-26).
seccompiler = "0.5"
# PS-A2: the guest narrows its own view of the filesystem and of TCP before the program runs —
# nothing writable anywhere, reads only from the system paths, no TCP bind or connect. Landlock is
# the kernel's own unprivileged sandbox (Linux 5.13+), so this needs no root and no namespace.
# MIT OR Apache-2.0, both on deny.toml's allowlist; the crate was approved by the owner in D-V2-25.
# It brings one new transitive crate, `enumflags2` (MIT OR Apache-2.0); `thiserror` and `libc` were
# already in the tree.
landlock = "0.4"

# PS-A2 round three: the macOS guest gets a processor-time ceiling and no core dump, applied in
# `pre_exec` with `setrlimit`. macOS has no `PR_SET_PDEATHSIG`, so a guest that is COMPUTING and asking
# for nothing would not notice its host had died — the channel it would otherwise fail on is idle. The
# processor-time ceiling is that bound, and without it the bound was "for ever". `libc` is declared
# again for this target rather than moved to `cfg(unix)`, because the Linux block above uses
# Linux-only names (`prctl`, `PR_SET_PDEATHSIG`) that do not exist on Apple platforms.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[package]
name = "delulu-broker"
description = "DeluluLang custody core (Stage 5): the ⊑ attenuation lattice, the in-memory grant tree, the two validation classes with revocation epochs, the hash-chained audit log, and MAC-signed lease tokens. Transport-free — no sockets, no daemon, no runtime wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# NOT a crates.io library. `STABILITY.md` §2: the Rust crates are an implementation
# detail; the stable interface is the language, the CLI and the machine schemas. Only the CLI is
# publishABLE -- and it is not actually publishABLE in practice: `cargo publish -p delulu` fails
# with "all dependencies must have a version requirement specified when publishing", because it
# depends on crates like this one by `path` alone. That is exactly the argument `INSTALL.md`
# section 3 makes for why `cargo install delulu` from crates.io is not offered, and
# `tests/distribution.rs` pins it from both sides. (This comment previously claimed
# "`cargo install delulu` works", which contradicted INSTALL.md -- corrected in campaign P17-F
# after verifying the failure with `--dry-run`.) Distribution is the archive from
# `scripts/package-toolchain.sh`; from source, `cargo install --path crates/delulu`.
publish = false

[package.metadata.delulu]
# Part of the language product: what a user of DeluluLang runs or depends on.
surface = "language"

[dependencies]
# Ruling 1: transport-free; depends ONLY on delulu-diag (Diagnostic) + delulu-check (Effect).
delulu-diag = { path = "../delulu-diag" }
delulu-check = { path = "../delulu-check" }
serde_json = { workspace = true }
# Ruling 3: OS-backed default GrantId randomness. getrandom 0.3 is already in the workspace dep
# tree (Cargo.lock), so we reuse it rather than adding `rand`.
getrandom = "0.3"
# Chunk 2 (phases 5d/5e): blake3 for BOTH the audit chain hash and the lease-token MAC
# (blake3::keyed_hash — head-chef ruling 1: no hmac/sha2 crates). Same "1" req as
# delulu-check/delulu-wasm, so Cargo unifies on the one workspace blake3 (1.8.x).
blake3 = "1"

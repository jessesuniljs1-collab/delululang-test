[package]
name = "delulu-syntax"
description = "DeluluLang lexer, token model, AST, and error-recovering recursive-descent parser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# NOT a crates.io library. `STABILITY.md` §2: the Rust crates are an implementation
# detail; the stable interface is the language, the CLI and the machine schemas. Only the
# CLI publishes, so `cargo install delulu` works and nothing else acquires a semver
# contract the stability document disclaims.
publish = false

[package.metadata.delulu]
# Part of the language product: what a user of DeluluLang runs or depends on.
surface = "language"

[dependencies]
delulu-diag = { path = "../delulu-diag" }
serde = { workspace = true }
# Stage 8 (8d): the formatter's identity-law fingerprint serializes the AST with spans/ids
# stripped. Already a workspace dependency of six sibling crates — not a new dependency.
serde_json = { workspace = true }

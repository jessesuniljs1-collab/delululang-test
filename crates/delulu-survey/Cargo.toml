[package]
name = "delulu-survey"
description = "The Survey: a measured, provenance-carrying map of the DeluluLang REPOSITORY — every edge cites the file and line it was read from"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# NOT a crates.io library. `STABILITY.md` §2: the Rust crates are an implementation
# detail; the stable interface is the language, the CLI and the machine schemas. Only the CLI is
# publishABLE -- and it is not actually publishABLE in practice: `cargo publish -p delulu` fails
# with "all dependencies must have a version requirement specified when publishing", because it
# depends on crates like this one by `path` alone. That is exactly the argument `INSTALL.md`
# section 3 makes for why `cargo install delulu` from crates.io is not offered, and
# `tests/distribution.rs` pins it from both sides. (This comment previously claimed
# "`cargo install delulu` works", which contradicted INSTALL.md -- corrected in campaign P17-F
# after verifying the failure with `--dry-run`.) Distribution is the archive from
# `scripts/package-toolchain.sh`; from source, `cargo install --path crates/delulu`.
publish = false

[package.metadata.delulu]
# Repository tooling: it measures, maps or checks THIS repository and means nothing
# outside it. Counted separately from the language surface.
surface = "tooling"

[[bin]]
name = "delulu-survey"
path = "src/main.rs"

[lib]
name = "delulu_survey"
path = "src/lib.rs"

[dependencies]
# Deliberately NO new third-party dependency and no sibling-crate dependency.
#
# No sibling crates: the Survey must be able to map a repository whose compiler does not currently
# build. A map you cannot open while the thing it maps is broken is a map you cannot use to fix it.
#
# No `toml`/`syn` parser: every fact is extracted line-wise so it can carry the exact line number it
# came from. A structural parser would give a better AST and lose the provenance that is the whole
# point (see `docs/survey/README.md`, "the provenance law"). The cost is honest and stated: this is
# a LEXICAL reader, and `src/rust.rs` documents what that cannot see.
serde = { workspace = true }
serde_json = { workspace = true }

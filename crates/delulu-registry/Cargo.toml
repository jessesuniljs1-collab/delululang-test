[package]
name = "delulu-registry"
description = "The DeluluLang package registry (Stage 9): sparse index, publish API, server-side authority recomputation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# NOT a crates.io library. `STABILITY.md` §2: the Rust crates are an implementation
# detail; the stable interface is the language, the CLI and the machine schemas. Only the
# CLI publishes, so `cargo install delulu` works and nothing else acquires a semver
# contract the stability document disclaims.
publish = false

[package.metadata.delulu]
# Part of the language product: what a user of DeluluLang runs or depends on.
surface = "language"

[[bin]]
name = "delulu-registry"
path = "src/main.rs"

[lib]
name = "delulu_registry"
path = "src/lib.rs"

[dependencies]
serde_json = { workspace = true }
delulu-runtime = { path = "../delulu-runtime" }
# getrandom 0.3 is already the workspace's randomness source (delulu-broker ruling 3, reused by
# delulu for keygen). Reused here for token values — not a new dependency.
getrandom = "0.3"

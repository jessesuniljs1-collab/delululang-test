\* THE TEETH TEST. INHERIT_EXPIRY = FALSE models the PRE-RFC-0001-F4 enforcement
\* read: per-node expiry only, no ancestor walk. TLC MUST find a counterexample to
\* NoUsableOrphan -- a child with ttl = NoTTL still usable under a parent whose
\* deadline has passed. That is the real historical bug, rediscovered by the model.
\*
\* If this run reports "No error has been found", the model is not testing anything
\* and must not be trusted.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n0, n1, n2}
    Effects = {eR, eW}
    MaxClock = 2
    NoParent = NoParent
    NoTTL = NoTTL
    INHERIT_EXPIRY = FALSE

CONSTRAINT StateConstraint

INVARIANT TypeOK
INVARIANT NoUsableOrphan

\* TEETH TEST 1 — the CERTIFICATE REPLAY vulnerability.
\* SINGLE_ADOPTION = FALSE removes cert.rs:544-554, the guard whose own message says
\* "re-presenting a credential must not undo a revocation". TLC MUST reconstruct the defect:
\* adopt -> revoke -> adopt the same certificate again -> live authority restored.
\* If this run reports "No error has been found", the model is not testing anything.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n0, n1}
    Certs = {c0}
    Tokens = {t0}
    MaxClock = 2
    NoNode = NoNode
    NoCert = NoCert
    NoTTL = NoTTL
    SINGLE_ADOPTION = FALSE
    LIVE_ON_REDEEM = TRUE

CONSTRAINT StateConstraint

INVARIANT TypeOK
INVARIANT RevocationSurvivesReadoption

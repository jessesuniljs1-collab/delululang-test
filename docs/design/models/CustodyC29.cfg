\* TEETH TEST 2 — campaign finding C29.
\* LIVE_ON_REDEEM = FALSE removes lease.rs:207-218, so `redeem` consults the token and the node's
\* EXISTENCE but never the node's STATE. TLC must reach a state where a redemption succeeded
\* against a revoked node or one under a dead ancestor — which is what wrote `decision: "allow"`
\* into the audit chain for a grant an operator had killed.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n0, n1}
    Certs = {c0}
    Tokens = {t0}
    MaxClock = 2
    NoNode = NoNode
    NoCert = NoCert
    NoTTL = NoTTL
    SINGLE_ADOPTION = TRUE
    LIVE_ON_REDEEM = FALSE

CONSTRAINT StateConstraint

INVARIANT TypeOK
INVARIANT NoRedemptionOfADeadGrant

[workspace]
resolver = "2"
members = [
    "crates/delulu-diag",
    "crates/delulu-syntax",
    "crates/delulu-check",
    "crates/delulu-runtime",
    "crates/delulu",
    "crates/delulu-conform",
    "crates/delulu-measure",
    "crates/delulu-registry",
    "crates/delulu-fuzz",
    "crates/delulu-wasm",
    "crates/delulu-broker",
    "crates/delulu-atlas",
]

[workspace.package]
# 1.0.0-rc.1, not 1.0.0. Every piece of 1.0's machinery is built and the acceptance gate has been
# run — and the gate says two criteria are NOT MET (`docs/release/CHECKLIST-1.0.md`: conformance
# coverage is 273/290, and the fresh-machine first-run has not been timed). Stamping 1.0.0 on a
# build its own checklist refuses would make every other honesty claim in this project worthless.
version = "1.0.0-rc.1"
edition = "2021"
repository = "https://github.com/delulu-lang/delulu"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stage 6 (Live): DIR — the Delulu typed IR — is serialized as versioned CBOR. `ciborium` is
# chosen over `minicbor` because it is serde-native: DIR mirrors the checker's own `serde`-derived
# types, so the codec is a derive rather than a hand-written, drift-prone encoder. Canonical bytes
# come from the schema (BTreeMap/Vec only — never a HashMap), not from the crate.
ciborium = "0.2"

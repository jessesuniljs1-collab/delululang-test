[workspace]
resolver = "2"
members = [
    "crates/delulu-diag",
    "crates/delulu-syntax",
    "crates/delulu-check",
    "crates/delulu-runtime",
    "crates/delulu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/delulu-lang/delulu"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

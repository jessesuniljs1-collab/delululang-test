[workspace]
resolver = "2"
members = [
    "crates/delulu-diag",
    "crates/delulu-syntax",
    "crates/delulu-check",
    "crates/delulu-runtime",
    "crates/delulu",
    "crates/delulu-conform",
    "crates/delulu-measure",
    "crates/delulu-registry",
    "crates/delulu-fuzz",
    "crates/delulu-wasm",
    "crates/delulu-broker",
    "crates/delulu-atlas",
    # Repository tooling, not language surface (`publish = false`): the Survey maps this repository
    # to itself. Listed last because nothing depends on it — it depends on nothing either, so that
    # the map still builds when the compiler does not.
    "crates/delulu-survey",
]

[workspace.package]
# 1.0.0 — stamped 2026-07-20, AFTER the gate said yes. The same gate refused this number at
# rc.1 (two criteria NOT MET, recorded in `docs/release/CHECKLIST-1.0.md` and build-order D19);
# both blockers were closed by work (D22: coverage 287/287, hard-gated; the D9 first-run drill,
# timed and recorded in `measurements/first-run/RECORD.md`) and the gate re-ran before this line
# changed. A gate that cannot say no is not a gate; this one did, once, and that is on record.
version = "1.0.0"
edition = "2021"
repository = "https://github.com/delulu-lang/delulu"
# The code is Apache-2.0 (see LICENSE, NOTICE). The DeluluLang NAME is a trademark of Jesse Sunil
# and is governed separately by TRADEMARK.md — the license covers the code, not the name.
license = "Apache-2.0"
authors = ["Jesse Sunil"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stage 6 (Live): DIR — the Delulu typed IR — is serialized as versioned CBOR. `ciborium` is
# chosen over `minicbor` because it is serde-native: DIR mirrors the checker's own `serde`-derived
# types, so the codec is a derive rather than a hand-written, drift-prone encoder. Canonical bytes
# come from the schema (BTreeMap/Vec only — never a HashMap), not from the crate.
ciborium = "0.2"

# DeluluLang CI — the 3-OS matrix (Stage 4 criteria 1 & 6: identical behavior on
# Linux/macOS/Windows, both engines, Python pinned to one version per run).
# Activates automatically once this repository is pushed to GitHub.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # The heavy gates below are too slow for every push and were therefore `#[ignore]`d — and then
  # nothing ever ran them. A nightly schedule and a manual button are what turn "run it explicitly"
  # from an instruction nobody follows into something that actually happens.
  #
  # The nightly runs every job below, the heavy gates included, unless the repository variable
  # NIGHTLY is `off` (Settings → Secrets and variables → Actions → Variables). From 2026-09-14 to
  # 2026-09-17 it was the other way round — off unless NIGHTLY was `on` — because the repository was
  # PRIVATE and every scheduled minute was billed, macOS and Windows at a premium. On 2026-09-17 the
  # owner made it public, where GitHub's standard runners are free, and asked for the restrictions
  # kept for cost to be reconsidered. The variable survives as an off-switch for a private copy of
  # this workflow, which would pay for the nightly again. GitHub disables a public repository's
  # schedule after 60 days without activity.
  schedule:
    - cron: "0 3 * * *"
  # The manual button (Actions → CI → Run workflow) asks which jobs to run. `everything`, the
  # default, runs every job, the heavy gates included; `heavy` runs heavy-gates and miri-slow alone,
  # and `heavy-gates` or `miri-slow` one of them (miri-slow is the slow one: three crates, up to 240
  # minutes each). Every other job checks the same choice in its `if:`. The choice was added on
  # 2026-09-14, when the repository was private and a manual run of the heavy gates also paid for the
  # whole matrix, so `heavy` was the default then. Since 2026-09-17 the repository is public and its
  # runners are free, so the default is `everything` again and the narrower choices are for speed.
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs: everything (default); heavy = heavy-gates + miri-slow; or one of those two alone"
        type: choice
        options: [everything, heavy, heavy-gates, miri-slow]
        default: everything

jobs:
  test:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Criterion 6: Python pinned to ONE version so cross-engine parity is stable.
      - name: Install Python 3.13 (pinned)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install NumPy (criterion-2 demo)
        run: python -m pip install numpy

      # `--no-fail-fast`: without it cargo stops at the first failing test BINARY. On the first run
      # (2026-09-14) that made every x86 job report one failure and hide whatever came after it;
      # arm64, which already said `--no-fail-fast`, was the only job that showed the whole picture.
      - name: Full workspace test suite
        run: cargo test --workspace --no-fail-fast

      # Stage 8 criterion 10: `delulu fmt --check` and locale invariance are permanent CI
      # gates. The suite already carries them (fmt identity/idempotence over the corpus +
      # generative gate in delulu-syntax::fmt; locale-invariant JSON in delulu/tests/
      # locale_cli.rs criterion7) — these steps make the fmt corpus check explicit and
      # fail the build on any unformatted committed source.
      - name: fmt --check the examples corpus
        run: cargo run -q -p delulu -- fmt --check examples

      # Stage 9h criterion 7: the Book's samples are conformance tests. A tutorial whose examples
      # do not compile teaches something false and wastes the reader's afternoon proving it.
      - name: fmt --check the Book's samples
        run: cargo run -q -p delulu -- fmt --check docs/book/samples

      # The Python-less build must stay a first-class citizen (DL1307 path).
      - name: Python-less build check
        run: cargo check -p delulu --no-default-features

      # Stage 9 invariant 42 (the coverage law): the conformance suite is the specification's
      # executable form. `--coverage` maps tests to reference anchors and fails on any anchor
      # missing an accepting or a rejecting witness, any dangling witness, or any unknown citation.
      #
      # `|| true` here is NOT a disabled gate, and the comment that used to sit in this spot said it
      # would be "flipped to a hard gate at the 1.0 cut". 1.0 shipped, and the flip happened
      # somewhere better: `release_requires_full_coverage` in delulu-conform's own suite asserts
      # 100% on EVERY commit, which `cargo test --workspace` above already ran. A per-commit test is
      # a stronger gate than a per-push workflow step, so this step is a human-readable report of a
      # number the build has already refused to let regress.
      - name: Conformance coverage law (report; hard-gated per-commit by delulu-conform's own suite)
        run: cargo run -q -p delulu-conform -- --coverage || true

      # Stage 9b: the reference is generated in part, so it cannot drift from the compiler.
      # This IS a hard gate: if the grammar, primitive table, diagnostics registry or rule index
      # changed without regenerating, the docs are already wrong and the build says so.
      - name: The generated reference is in sync with the source
        run: cargo run -q -p delulu-conform -- --check-reference

      # ---- P17 proof campaign gates -------------------------------------------------------
      # Every step below runs a check the campaign added. They are written here so the evidence
      # is reproducible by anyone. NONE of them executed on a runner before the repository's first
      # push (2026-09-14, to a private testing remote), and none counts as green until a run's result
      # is recorded in docs/design/CROSS_PLATFORM_VERIFICATION.md — "prepared but unverified" is a
      # different claim from "green", and this file must not blur them.

      # P17-F: the CLI + compiler sweep, 22 cases with exact exit codes. It replaced a procedure
      # that had been performed BY HAND every pass, which is the drift design rule 1 warns about.
      - name: CLI + compiler sweep
        shell: bash
        run: sh scripts/cli-sweep.sh

      # P17-D: generated programs, not examples. The grammar now contains the shapes that
      # historically broke the language (generics reaching higher-order builtins, closures
      # carrying rows, the Secret.map+verify oracle) — see crates/delulu-fuzz/src/danger.rs.
      - name: Effect-soundness fuzz campaign (trace ⊆ row, locally AND as a sandbox guest)
        run: cargo run -q -p delulu-fuzz -- 50000 20260804

  # ---- ARM64 -------------------------------------------------------------------------------
  # The 3-OS matrix above is x86_64 on every runner, so "works on Linux" has only ever meant
  # "works on x86_64 Linux". Apple Silicon is ARM and cannot be checked from the development host
  # (blake3 compiles a NEON path through cc-rs, and no Apple/ARM cross-compiler exists there — see
  # docs/design/CROSS_PLATFORM_VERIFICATION.md §5). An ARM Linux runner does not prove macOS, but it
  # does exercise every non-Apple-specific ARM code path, which nothing currently does.
  #
  # Never executed before the first push (2026-09-14), like everything else in this file.
  arm64:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full workspace test suite (aarch64)
        run: cargo test --workspace --no-fail-fast

  # ---- Lints -------------------------------------------------------------------------------
  # THIS JOB COULD NOT PASS UNTIL 2026-08-07, and nobody knew, because CI has never run.
  #
  # `-D warnings` promotes EVERY warning to an error, not only new ones — the comment that used to
  # sit here claimed otherwise. There were 14 outstanding lints, so the step failed on its first
  # line. All 14 are now resolved: the mechanical ones fixed, and four `#[allow]`s each carrying the
  # reason the code deliberately rejects the lint (a hot enum whose boxing would cost an allocation
  # per indexed assignment; a partial `eq` that must NOT claim `PartialEq`; an 8-argument trace call
  # that mirrors the interpreter's positionally so the differential test stays readable; a byte
  # literal that would need a pointless cast as `c""`). `cargo clippy --workspace --all-targets
  # -- -D warnings` now exits 0, so from here this step means something.
  #
  # `cargo fmt --all -- --check` is NOT run, and that is a decision rather than an oversight.
  # This codebase is hand-formatted and has no `rustfmt.toml`; rustfmt's default style produces
  # **3,890** diffs against it, and raising `max_width` does not close the gap (2,766 at 120). The
  # three options were: reformat ~102,000 lines in one unreviewable commit, keep a step that is red
  # forever, or say plainly that the project has not adopted rustfmt. A permanently red step is the
  # worst of the three — it teaches people that red is normal, which is how a real failure gets
  # ignored.
  #
  # ADOPTING RUSTFMT IS AN OWNER DECISION, not a cleanup task, because it rewrites every file in the
  # repository and this project's comments carry much of its value. Until that decision is made,
  # formatting is not enforced, and this comment is where that is admitted.
  lints:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---- Undefined behaviour -----------------------------------------------------------------
  # Miri interprets the code and reports UB that a normal build silently tolerates. It is run
  # PER CRATE rather than over the workspace because a single run had twice been started and never
  # finished, and an unfinished run is not a pass. `-Zmiri-disable-isolation` is required by the
  # crates whose tests touch the filesystem — without it Miri aborts on `create_dir_all` with
  # "unsupported operation", which is a Miri limitation and NOT a finding.
  #
  # Nothing is skipped here, and that took a change in the tests rather than in this file. Miri is
  # roughly two orders of magnitude slower than native, so the bulk tests — 2,000 generated programs,
  # the whole repository corpus — did not finish inside a 30-minute budget, and an unfinished run is
  # not a pass. The first fix written here was `--skip`, which was wrong in an instructive way: it
  # buys a green tick by interpreting *none* of that code. The tests now shrink themselves under
  # `cfg!(miri)` instead, so the same code paths are interpreted on a small input. What Miri gives up
  # is the REPETITION; the native run on every commit still does the full count.
  #
  # The corpus test's budget counts files EXAMINED rather than files checked. Counting checked files
  # bounds nothing — the walk still parses every reject-corpus file it meets, and those are
  # deliberately parse-dirty and numerous — which is why the first version of that cap ran for forty
  # minutes without finishing. A limit on the results you keep is not a limit on the work you do.
  #
  # `-Zmiri-disable-stacked-borrows` would be a large further speedup and is deliberately NOT used:
  # it turns off Miri's pointer-aliasing engine, which is its strongest detector. A faster run that
  # reports "0 UB" while unable to see aliasing violations is weaker evidence wearing the same
  # sentence, and this repository's rule is that a gate which cannot fail is not a gate.
  #
  # `timeout-minutes` makes a regression in this cost surface as a failure rather than a long bill.
  #
  # Every push runs the crates that fit. `delulu-broker`, `delulu-syntax` and `delulu-check` are in
  # `miri-slow` below, and the numbers that put them there are in its comment.
  miri:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate: [delulu-diag, delulu-atlas]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: "miri, rust-src" }
      - uses: Swatinem/rust-cache@v2
      # `+nightly` is load-bearing. `rust-toolchain.toml` pins 1.96.1 for the whole tree and outranks
      # the toolchain this job installs, and Miri exists only on nightly — so a bare `cargo miri`
      # fails in seconds: "the 'miri' component ... is not available for the '1.96.1' toolchain".
      # That was reproduced locally on 2026-09-14, the day this workflow first ran and went red.
      - name: Miri — ${{ matrix.crate }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --lib -p ${{ matrix.crate }}

  # The three crates whose Miri runs do not fit a push. On the first run that reached them
  # (2026-09-14, a 2-vCPU runner) each was cancelled at the 45-minute cap with no UB found in what it
  # had interpreted: delulu-broker finished 95 of 150 tests and then spent 39 minutes on one;
  # delulu-syntax finished 103 of 130 and then spent 24 minutes on one; delulu-check finished 25 of
  # 237 at about 30 seconds each, which is two hours at that rate. None of the three contains an
  # `unsafe` block (see `miri-ffi`), so what Miri checks here is safe code and the dependencies' unsafe
  # beneath it. That is worth running, but not worth 135 runner-minutes and a red cross on every
  # push. It runs nightly (unless NIGHTLY is `off`) and by hand (Run workflow → `everything`, `heavy`
  # or `miri-slow`), with a 240-minute budget — which no run has yet confirmed is enough.
  miri-slow:
    if: (github.event_name == 'schedule' && vars.NIGHTLY != 'off') || (github.event_name == 'workflow_dispatch' && inputs.jobs != 'heavy-gates')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        crate: [delulu-broker, delulu-syntax, delulu-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: "miri, rust-src" }
      - uses: Swatinem/rust-cache@v2
      # `+nightly`: the pin in rust-toolchain.toml outranks the installed toolchain (see `miri`).
      - name: Miri — ${{ matrix.crate }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --lib -p ${{ matrix.crate }}

  # ---- The gates that were `#[ignore]`d and then never run -----------------------------------
  # Two tests carry acceptance criteria the project states about itself, and both were marked
  # `#[ignore]` so the ordinary suite would stay fast:
  #
  #   * `fmt_laws_100k_gate`                      — criterion 4's >=100,000 program formatter gate
  #   * `criterion3_latency_150ms_on_10kloc_release` — criterion 3's LSP latency gate on 10 kLOC
  #
  # Nothing ran either of them. No workflow passed `--ignored`, so the documented way to run them
  # was a sentence in a doc comment addressed to whoever remembered. A criterion that is asserted in
  # the specification, implemented as a test, and never executed is a claim, not evidence — and it
  # is the more dangerous kind, because the test EXISTS and reads as coverage.
  #
  # Nightly rather than per-push because they are genuinely slow, and `workflow_dispatch` so a
  # release can demand them on the spot instead of waiting for the clock (Run workflow → `everything`,
  # `heavy` or `heavy-gates`).
  heavy-gates:
    if: (github.event_name == 'schedule' && vars.NIGHTLY != 'off') || (github.event_name == 'workflow_dispatch' && inputs.jobs != 'miri-slow')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Criterion 4 — the 100k-program formatter gate
        run: cargo test -p delulu-syntax --release -- --ignored fmt_laws_100k
      - name: Criterion 3 — LSP latency on 10 kLOC, release mode
        run: cargo test -p delulu --release --test lsp_cli -- --ignored criterion3_latency
      - name: The differential wasm gate
        run: cargo test -p delulu-wasm --release --test differential -- --ignored

  # The matrix above is aimed at the wrong crates, and this job is the correction.
  #
  # Counting `unsafe` in first-party sources: `delulu` 37 (Windows FFI — SIDs, handle inheritance),
  # `delulu-runtime` 13 (`ptr.add`, `slice::from_raw_parts`, `dlopen`, `extern "C"` calls),
  # `delulu-diag` 2, and ZERO in delulu-atlas, delulu-broker, delulu-syntax and delulu-check. Miri
  # was running on four crates with no `unsafe` at all and skipping the two holding 50 of the 54
  # sites. "0 UB" was true and much weaker than it sounded.
  #
  # Most of that gap is a real boundary that stays open: Miri cannot execute `dlopen` or Windows API
  # calls, so the FFI itself is beyond it — an explicit assumption, not a to-do. But
  # `validate_c_string` is a PURE function over caller-supplied memory: a hand-rolled NUL scan with
  # pointer arithmetic and `from_raw_parts`, the highest-risk code in the tree, needing no foreign
  # library to exercise. It already had tests against crafted Rust-owned buffers; nothing had ever
  # run them under the interpreter. They take 2.4 seconds — against 26 minutes for a crate with no
  # `unsafe` in it.
  #
  # The detector was confirmed live rather than assumed: a probe reading past a 4-byte allocation was
  # caught as "at or beyond the end of the allocation of size 4 bytes". A gate that cannot fail is
  # not a gate, and that applies to the tool as much as to the test.
  miri-ffi:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: "miri, rust-src" }
      - uses: Swatinem/rust-cache@v2
      # `+nightly`: the pin in rust-toolchain.toml outranks the installed toolchain (see `miri`).
      - name: Miri — the raw-pointer decoding in delulu-runtime
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --lib -p delulu-runtime -- foreign::tests


  # ---- Coverage-guided fuzzing of the channel -----------------------------------------------
  # `MATHEMATICS.md` category 6 said "fuzz verified: partial — cargo-fuzz targets are installed but
  # not yet written". This is the first one written, and it is aimed at the decoder that reads bytes
  # from a peer the host has deliberately assumed is compromised: the sandbox channel.
  #
  # The property is NOT in the target. It lives in `delulu-runtime::channel::fuzz_one_frame`, which
  # the ordinary workspace suite also calls over a seeded structure-aware corpus on every commit. So
  # this job is coverage-guided depth on top of a gate that already runs per push, rather than the
  # only place the rule exists — the arrangement that kept two stale copies of a rule out of PS-A.
  #
  # Bounded on purpose: a minute of fuzzing per push finds shallow regressions quickly, and the
  # nightly can be pointed at it for longer when there is something to look for.
  fuzz:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "fuzz" }
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: The channel frame target — one minute, coverage-guided
        working-directory: fuzz
        # `+nightly` explicitly: rust-toolchain.toml pins stable and OUTRANKS the toolchain the
        # action installed, which is how the very first Miri job on this repository went red.
        run: cargo +nightly fuzz run channel_frame -- -max_total_time=60 -rss_limit_mb=4096
      - name: Any crash the run found, for reading
        if: failure()
        run: ls -la artifacts/channel_frame 2>/dev/null && for f in artifacts/channel_frame/*; do echo "== $f =="; xxd "$f" | head -20; done

  # ---- Editor surface ----------------------------------------------------------------------
  # The VS Code extension shipped for the life of the project with a command-injection hole (the
  # run lens interpolated the open file's path into a shell command STRING), a code lens the client
  # never registered, and a .vsix that would have thrown `Cannot find module` on activation because
  # vsce shipped one of the eight packages npm installed. None of it could fail a build, because the
  # server is Rust, the client is JavaScript, and nothing read both. `editor_contract.rs` (run by the
  # workspace suite) compares them; this job proves the artifact a user would actually install works.
  editor:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build the extension
        working-directory: editors/vscode
        run: npm ci && npm run package
      - name: The built .vsix would actually activate
        working-directory: editors/vscode
        run: npm run verify

  # ---- Supply chain -----------------------------------------------------------------------
  # P17-F: before that campaign `cargo deny` had NEVER been run and 19 advisories had accumulated.
  # For a while this step was `continue-on-error: true`, because four advisories were reachable and
  # were deliberately not silenced — reporting without blocking was the honest posture then.
  #
  # It is no longer the honest posture. The wasmtime 27 -> 47 upgrade closed the two that mattered
  # (including RUSTSEC-2026-0096, the aarch64 Cranelift sandbox escape), and a re-run on 2026-08-07
  # reports "advisories ok". A check that passes and CANNOT FAIL THE BUILD is not a gate, so the
  # flag is gone: from here a new advisory blocks.
  #
  # It did, on the first real run (2026-09-14): two advisories published after 2026-08-07 against
  # wasmtime 47.0.3 — RUSTSEC-2026-0268 and RUSTSEC-2026-0269, both in WASI functionality this
  # project never calls. The 47.0.4 patch release closed both. The gate did its job on its first day.
  #
  # Two pyo3 entries remain ignored on reachability grounds, and that argument is itself gated by
  # `governance.rs::the_ignored_pyo3_advisories_are_still_unreachable` — because an `ignore` whose
  # reason has quietly stopped being true is worse than no gate at all: the tool prints a green
  # line, and the green line is what people read.
  supply-chain:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
      - name: Bans, licences and sources (these DO gate)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # ---- Formal models ----------------------------------------------------------------------
  # P17-C/8/9. Each of these has been executed locally and its verbatim output is recorded in
  # docs/design/models/README.md; these steps make them reproducible rather than transcribed.
  formal:
    if: (github.event_name != 'schedule' || vars.NIGHTLY != 'off') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'everything')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (for TLC)
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Fetch TLA+ tools
        run: curl -sSfL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      # The grant tree: 585,771 distinct states, no error.
      - name: Model-check the grant tree
        working-directory: docs/design/models
        run: java -XX:+UseParallelGC -cp $GITHUB_WORKSPACE/tla2tools.jar tlc2.TLC -config Broker.cfg Broker.tla

      # Leases + certificates: 2,421 distinct states, no error.
      - name: Model-check leases and certificate adoption
        working-directory: docs/design/models
        run: java -XX:+UseParallelGC -cp $GITHUB_WORKSPACE/tla2tools.jar tlc2.TLC -config Custody.cfg Custody.tla

      # THE TEETH TESTS. Each removes a real fix and REQUIRES TLC to fail, reconstructing a bug
      # this project actually shipped. A model that has never caught anything is indistinguishable
      # from one that cannot, so a PASS here is a FAILURE of the model.
      - name: Teeth test — inherited expiry (TLC must FAIL)
        working-directory: docs/design/models
        run: |
          if java -XX:+UseParallelGC -cp $GITHUB_WORKSPACE/tla2tools.jar tlc2.TLC -config BrokerBug.cfg Broker.tla; then
            echo "::error::BrokerBug.cfg did NOT fail — the model has lost its teeth"; exit 1
          fi
      - name: Teeth test — certificate replay (TLC must FAIL)
        working-directory: docs/design/models
        run: |
          if java -XX:+UseParallelGC -cp $GITHUB_WORKSPACE/tla2tools.jar tlc2.TLC -config CustodyReplay.cfg Custody.tla; then
            echo "::error::CustodyReplay.cfg did NOT fail — the model has lost its teeth"; exit 1
          fi
      - name: Teeth test — C29 dead-grant redemption (TLC must FAIL)
        working-directory: docs/design/models
        run: |
          if java -XX:+UseParallelGC -cp $GITHUB_WORKSPACE/tla2tools.jar tlc2.TLC -config CustodyC29.cfg Custody.tla; then
            echo "::error::CustodyC29.cfg did NOT fail — the model has lost its teeth"; exit 1
          fi

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: The ten-dimension authority algebra (Z3, 26 obligations)
        run: |
          python -m pip install z3-solver
          python docs/design/models/authority_algebra.py
      # PS-B-05: the model's teeth. Each named mutant must end with obligations NOT discharged — not
      # merely a failing exit, which an unknown mutant name (exit 2) would also produce.
      - name: The authority algebra has teeth (3 Z3 mutants must each fail)
        run: |
          for m in budget-meet-max budget-absent-child-passes budget-dropped; do
            if DELULU_Z3_MUTANT=$m python docs/design/models/authority_algebra.py > z3-mutant.txt; then
              echo "::error::Z3 mutant $m was NOT caught — the model has lost its teeth"; exit 1
            fi
            if ! grep -q "obligation(s) NOT discharged" z3-mutant.txt; then
              echo "::error::Z3 mutant $m failed for some other reason"; cat z3-mutant.txt; exit 1
            fi
            echo "caught: $m"
          done

      # P17-9: the higher-order fragment, machine checked. Silence means every declaration
      # type-checked; the file's own `#print axioms` block is what proves no `sorry` is hiding.
      - name: Machine-check Delulu Core (Lean)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.2
          . "$HOME/.elan/env"
          cd docs/design/models/lean && lean DeluluCore.lean

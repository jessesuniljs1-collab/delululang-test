name: fable-research

# RESEARCH ONLY — the Fable 5.2 verification audit's own fixtures on GitHub runners.
#
# This file exists only on the throwaway branch `laptop/fable-research-runner`, which is never merged
# and is deleted once its runs are read. It builds `delulu` from this branch's source — the same
# tree as `master` at ac2a162 for every crate, manifest and lock file — and runs benign programs
# against it (research/fable-s1/). It asserts nothing about the product: the job prints
# observations, and fails only if the harness itself breaks.
#
# Round 3: the two-principal custody test alone, on Linux x86-64, with the Python-free build —
# round 2 showed the default build cannot start under another OS account (it needs the build
# machine's libpython on the loader path).
on:
  push:
    branches: ["laptop/fable-research-runner"]

permissions:
  contents: read

jobs:
  two-principals:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the Python-free variant (net only), commit stamped
        shell: bash
        run: |
          export DELULU_BUILD_COMMIT="$(git rev-parse HEAD)"
          cargo build -p delulu --locked --no-default-features --features net
      # Two principals as two real OS accounts with their own keys and homes (the audit's track T5).
      # Disposable accounts on a disposable runner; nothing here touches a real credential.
      - name: Two principals, two OS accounts
        shell: bash
        run: |
          sudo useradd -m fable-a
          sudo useradd -m fable-b
          sudo install -m 0755 target/debug/delulu /usr/local/bin/delulu-fable
          sudo -n -u fable-a /usr/local/bin/delulu-fable --version
          sudo mkdir -p /srv/fable-t5
          sudo chown "$(id -un)" /srv/fable-t5
          FABLE_EXE=/usr/local/bin/delulu-fable FABLE_T5_USER_A=fable-a FABLE_T5_USER_B=fable-b FABLE_T5_BASE=/srv/fable-t5 \
            python -B research/fable-s1/t5.py

# A witness on one operating system, by hand (routine run 3, 2026-09-29 — loop engineering).
#
# AGENTS.md: witness a defect failing BEFORE fixing it. A defect that lives only on macOS or Windows
# can be witnessed only on a runner, and the push run's whole matrix is the slow way to do it — and the
# wrong place, because a red witness pushed to `master` turns master red. So: push the witness alone
# to a branch, dispatch this at that branch, read it RED; add the fix, dispatch again, read it GREEN;
# only then does either reach `master`. It runs ONE test target of ONE package on ONE runner.
#
# The inputs reach the script through the environment, never spliced into it (a dispatcher's text is
# data, not shell). Runs only by hand; it gates nothing and publishes nothing.
name: witness

on:
  workflow_dispatch:
    inputs:
      os:
        description: "The runner"
        type: choice
        options: [macos-latest, windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
        default: macos-latest
      package:
        description: "The cargo package"
        type: string
        default: delulu
      target:
        description: "Test targets, space-separated: an integration test's file name without .rs, `lib`, `bin:NAME` (a binary's unit tests); or `all` for the package's every test"
        type: string
        required: true
      filter:
        description: "A test-name filter (empty: every test in the target)"
        type: string
        default: ""
      repeat:
        description: "Run the selection this many times in this one job, each run counted (a rare red needs many runs)"
        type: string
        default: "1"
      stress:
        description: "Busy loops beside the runs, each holding one CPU (0: none) — a starved runner, set rather than guessed"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  witness:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The test job's Python, so the binary under test is the one the push run builds.
      - uses: actions/setup-python@v6
        if: inputs.os != 'ubuntu-24.04-arm'
        with:
          python-version: "3.13"
      # As the test job does on Linux x86-64 (PS-B-03b): a guest there gets a subordinate uid.
      - name: Allow unprivileged user namespaces (Linux x86-64)
        if: inputs.os == 'ubuntu-24.04'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "DELULU_REQUIRE_SUBORDINATE_UID=1" >> "$GITHUB_ENV"
      - name: The witness
        shell: bash
        env:
          PKG: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
          FILTER: ${{ inputs.filter }}
          REPEAT: ${{ inputs.repeat }}
          STRESS: ${{ inputs.stress }}
        run: |
          # Several targets in one run: a green read must cover every target that exercises the changed
          # code on this OS (routine run 3 read the macOS watcher green on three and missed a fourth).
          sel=()
          for t in $TARGET; do
            case "$t" in
              all) sel=() ; break ;;
              lib) sel+=(--lib) ;;
              bin:*) sel+=(--bin "${t#bin:}") ;;
              *) sel+=(--test "$t") ;;
            esac
          done
          case "$REPEAT" in ''|*[!0-9]*|0) echo "repeat must be a positive number, not '$REPEAT'"; exit 2 ;; esac
          case "$STRESS" in ''|*[!0-9]*) echo "stress must be a number, not '$STRESS'"; exit 2 ;; esac
          if [ "$REPEAT" -eq 1 ] && [ "$STRESS" -eq 0 ]; then
            echo "cargo test -p $PKG ${sel[*]} --no-fail-fast -- $FILTER --nocapture"
            cargo test -p "$PKG" "${sel[@]}" --no-fail-fast -- "$FILTER" --nocapture
            exit $?
          fi
          # RW 7.25: a red seen twice in hundreds of runs is read only by running it many times, as the push run
          # runs it — the whole target's tests side by side, their output captured — and counting every run.
          # What the runs share is said first: the CPUs, and on Windows the real-time scanner, which reads a
          # file another process has just written.
          echo "CPUs: $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-?}")"
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command \
              "Get-MpComputerStatus | Select-Object AMRunningMode,RealTimeProtectionEnabled,OnAccessProtectionEnabled | Format-List" \
              || echo "(the scanner's status could not be read)"
          fi
          # On macOS, the policy a background launchd job runs under (RW 7.25): a job started with no ProcessType,
          # or a Background one, is CPU- and disk-throttled, and its children inherit the disk policy (0 default,
          # 3 throttle, 4 utility, 5 standard). Measured, not assumed.
          if [ "$RUNNER_OS" = macOS ]; then
            echo "lowpri throttle: $(sysctl -n debug.lowpri_throttle_enabled 2>/dev/null || echo '?')"
            python3 -c "import ctypes; c = ctypes.CDLL(None); print('disk I/O policy of this step: process', c.getiopolicy_np(0, 0), 'thread', c.getiopolicy_np(0, 1))" \
              || echo "(the disk I/O policy could not be read)"
            grep -H -A1 ProcessType ~/Library/LaunchAgents/*.plist /Library/LaunchDaemons/*.plist 2>/dev/null \
              || echo "(no ProcessType in a readable launchd plist)"
          fi
          cargo test -p "$PKG" "${sel[@]}" --no-run
          hogs=()
          trap 'for h in "${hogs[@]}"; do kill "$h" 2>/dev/null; done' EXIT
          for ((h = 0; h < STRESS; h++)); do
            ( while :; do :; done ) &
            hogs+=($!)
          done
          echo "$STRESS busy loop(s) running; $REPEAT run(s) of: cargo test -p $PKG ${sel[*]} --no-fail-fast -- $FILTER"
          failed=0
          for ((i = 1; i <= REPEAT; i++)); do
            echo "::group::run $i of $REPEAT"
            if cargo test -p "$PKG" "${sel[@]}" --no-fail-fast -- "$FILTER"; then
              echo "run $i of $REPEAT: ok"
            else
              failed=$((failed + 1))
              echo "::error::run $i of $REPEAT FAILED"
            fi
            echo "::endgroup::"
          done
          echo "$failed of $REPEAT run(s) failed ($STRESS busy loop(s) beside them)"
          [ "$failed" -eq 0 ]

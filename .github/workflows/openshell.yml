# DeluluLang's OpenShell export, checked by OpenShell's own prover (PS-E-05 (a), D-V2-82; routine run 8).
#
# `delulu sandbox policy FILE --format openshell` writes the wall an OpenShell sandbox should put around
# `delulu run`, derived from the program's authority and its grants. `scripts/openshell-prove.sh` asks
# NVIDIA's independent prover whether that document stays inside a boundary written by hand — and proves
# the question can be answered no: each widening of the export must come back `exceeds_boundary`, and a
# field the format does not have must be an error. Two tools, one DeluluLang's and one NVIDIA's, on the
# same program (`docs/DELULULANG_V2/V2_OPENSHELL_STUDY.md` §4.5).
#
# The prover is a pinned OpenShell release, downloaded HERE on the runner and checked against the
# release's own SHA-256 list; the VM cannot reach release assets of another repository. Nothing of
# OpenShell enters this repository (D-V2-52): no asset, script, schema or text is committed, cached or
# uploaded. By hand first, as `container.yml` and `ocsf.yml` were. It gates nothing and publishes nothing.
name: openshell

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The OpenShell release tag whose prover checks the export (the study read v0.1.2)"
        type: string
        default: "v0.1.2"
      runtime:
        description: "Also run the export under a real OpenShell sandbox (a local gateway, the Docker driver) — PS-E-05's runtime witnesses, by hand first"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build delulu
        run: cargo build -p delulu --locked
      - name: Install OpenShell's pinned release, checksums verified
        env:
          TAG: ${{ inputs.version || 'v0.1.2' }}
        run: scripts/openshell-install.sh "$TAG"
      - name: The export, checked by the prover
        run: scripts/openshell-prove.sh target/debug/delulu

  # The export ENFORCED: a local gateway with the Docker driver creates a sandbox from an image holding this
  # build's delulu and a program, under exactly the exported policy; the granted program runs, a greedy one is
  # refused by DeluluLang, and curl to an unlisted host is denied by OpenShell (scripts/openshell-runtime.sh).
  runtime:
    if: ${{ inputs.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # As the repository's Dockerfile builds it: the default build links the embedded Python, which a plain
      # image lacks (run 5: `libpython3.12.so.1.0: cannot open shared object file` inside the sandbox).
      - name: Build delulu (no embedded Python, as the Dockerfile builds it)
        run: cargo build -p delulu --locked --no-default-features --features net
      - name: Install OpenShell's pinned release, checksums verified
        env:
          TAG: ${{ inputs.version || 'v0.1.2' }}
        run: scripts/openshell-install.sh "$TAG"
      - name: The export under a real OpenShell sandbox
        run: scripts/openshell-runtime.sh target/debug/delulu

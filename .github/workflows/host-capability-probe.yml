# Host-capability probe for the sandbox research pass (docs/archive/v1/NEXT_EVOLUTION_2026/SANDBOX_RESEARCH.md).
#
# Runs ONLY by hand (workflow_dispatch). It builds nothing and tests nothing: it prints what each
# GitHub-hosted runner actually offers an execution sandbox — KVM, unprivileged user namespaces,
# the Landlock ABI, hypervisor support on macOS, the Windows Hypervisor Platform / Hyper-V state.
# Every step is `continue-on-error` so a missing capability is a recorded fact, never a red run.
# The result is read with `gh run view` and transcribed into the research record; "activated" is
# not "executed", and an unread run is evidence of nothing.
# PS-0-08 added three EXPERIMENTS (KVM + a fetched Firecracker booted to /init; a differential Seatbelt
# probe; a restricted-token child inside a Job Object). Each prints `RESULT <name>: PASS|FAIL` lines.
name: host-capability-probe
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: kernel, kvm, user namespaces, landlock
        continue-on-error: true
        run: |
          set +e
          echo "== kernel =="; uname -r
          echo "== /dev/kvm =="; ls -la /dev/kvm 2>&1; echo "exit=$?"
          echo "== cpu virt flags =="; grep -c -E 'vmx|svm' /proc/cpuinfo
          echo "== kvm-ok (if present) =="; command -v kvm-ok && kvm-ok 2>&1
          echo "== unprivileged user namespaces =="; cat /proc/sys/kernel/unprivileged_userns_clone 2>&1; cat /proc/sys/user/max_user_namespaces 2>&1
          echo "== apparmor restrict unprivileged userns =="; cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1
          echo "== unshare -Ur true =="; unshare -Ur true; echo "exit=$?"
          echo "== unshare -Urm true (mount ns) =="; unshare -Urm true; echo "exit=$?"
          echo "== unshare -Urn true (net ns) =="; unshare -Urn true; echo "exit=$?"
          echo "== landlock ABI (via python ctypes landlock_create_ruleset LANDLOCK_CREATE_RULESET_VERSION) =="
          python3 - <<'PY'
          import ctypes, os
          libc = ctypes.CDLL(None, use_errno=True)
          SYS_landlock_create_ruleset = 444
          r = libc.syscall(SYS_landlock_create_ruleset, None, 0, 1)
          print("landlock ABI version:", r, "errno:", ctypes.get_errno())
          PY
          echo "== seccomp =="; grep -i seccomp /proc/self/status
          echo "== bwrap / firecracker / cloud-hypervisor / virtiofsd / docker / runsc on PATH =="; for b in bwrap firecracker cloud-hypervisor virtiofsd docker runsc podman; do printf "%s: " "$b"; command -v $b || echo "absent"; done
          echo "== cgroup v2 =="; stat -fc %T /sys/fs/cgroup 2>&1; cat /sys/fs/cgroup/cgroup.controllers 2>&1
          echo "== systemd-run --user available? =="; systemd-run --user --scope -p MemoryMax=64M true 2>&1; echo "exit=$?"
          echo "== nproc / mem =="; nproc; free -m | head -2
  macos:
    runs-on: macos-latest
    steps:
      - name: hypervisor support, sandbox-exec, arch
        continue-on-error: true
        run: |
          set +e
          echo "== sw_vers =="; sw_vers
          echo "== arch =="; uname -m
          echo "== kern.hv_support =="; sysctl kern.hv_support 2>&1
          echo "== sandbox-exec present =="; ls -la /usr/bin/sandbox-exec 2>&1
          echo "== sandbox-exec deny-all can run /bin/echo? =="; sandbox-exec -p '(version 1) (deny default) (allow process-exec (literal "/bin/echo")) (allow file-read* (literal "/bin/echo") (subpath "/usr/lib") (subpath "/System/Library"))' /bin/echo hi 2>&1; echo "exit=$?"
          echo "== sandbox-exec: network denied? (curl to localhost should fail) =="; sandbox-exec -p '(version 1) (deny default) (allow process-exec*) (allow file-read*) (deny network*)' /usr/bin/curl -s -m 3 http://127.0.0.1:1/ 2>&1; echo "exit=$?"
          echo "== virtualization entitlement helpers: container CLI? =="; command -v container || echo "absent"
          echo "== nproc / mem =="; sysctl -n hw.ncpu hw.memsize
  windows:
    runs-on: windows-latest
    steps:
      - name: hyper-v / WHP / job objects / appcontainer
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "== OS =="; (Get-CimInstance Win32_OperatingSystem).Caption; [Environment]::OSVersion.Version
          Write-Host "== hypervisor present (systeminfo Hyper-V section) =="; systeminfo | Select-String -Pattern 'Hyper-V|Virtualization'
          Write-Host "== optional features (HypervisorPlatform, Microsoft-Hyper-V, Containers, VirtualMachinePlatform) =="
          foreach ($f in 'HypervisorPlatform','Microsoft-Hyper-V-All','Containers','VirtualMachinePlatform','Microsoft-Windows-Subsystem-Linux') { try { $s = (Get-WindowsOptionalFeature -Online -FeatureName $f -ErrorAction Stop).State; Write-Host "$f : $s" } catch { Write-Host "$f : query failed ($($_.Exception.Message))" } }
          Write-Host "== is this session admin? =="; ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "== docker on PATH =="; Get-Command docker -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          Write-Host "== nproc / mem =="; $env:NUMBER_OF_PROCESSORS; (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory

  # ---- PS-0-08 experiments (2026-09-18). Each prints a verdict line `RESULT <name>: <PASS|FAIL> …`
  # that the head chef transcribes; `continue-on-error` keeps a missing capability a fact, not a red run.
  linux-kvm-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: can this runner open /dev/kvm, and boot a fetched VMM to /init?
        continue-on-error: true
        run: |
          set +e
          echo "== /dev/kvm before =="; ls -la /dev/kvm
          python3 - <<'PY'
          import os, fcntl
          try:
              fd = os.open("/dev/kvm", os.O_RDWR)
              v = fcntl.ioctl(fd, 0xAE00)  # KVM_GET_API_VERSION
              print("RESULT kvm-open-as-runner: PASS api", v)
          except Exception as e:
              print("RESULT kvm-open-as-runner: FAIL", e)
          PY
          # The runner user may not be in the kvm group; record, then grant it for the boot attempt.
          sudo chmod 666 /dev/kvm; ls -la /dev/kvm
          python3 -c 'import os,fcntl; fd=os.open("/dev/kvm",os.O_RDWR); print("RESULT kvm-open-after-chmod: PASS api", fcntl.ioctl(fd,0xAE00))' || echo "RESULT kvm-open-after-chmod: FAIL"
          ARCH=$(uname -m); FC=v1.10.1
          curl -fsSL -o fc.tgz "https://github.com/firecracker-microvm/firecracker/releases/download/${FC}/firecracker-${FC}-${ARCH}.tgz" || echo "RESULT vmm-fetch: FAIL"
          tar xzf fc.tgz && cp release-${FC}-${ARCH}/firecracker-${FC}-${ARCH} ./firecracker && ./firecracker --version | head -1
          curl -fsSL -o vmlinux "https://s3.amazonaws.com/spec.ccfc.min/img/quickstart_guide/${ARCH}/kernels/vmlinux.bin" || echo "RESULT kernel-fetch: FAIL"
          # A kernel-only image whose /init prints a marker and powers off — the shape PS-C boots.
          sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq busybox-static cpio >/dev/null
          mkdir -p ird/bin && cp /bin/busybox ird/bin/ && ln -sf busybox ird/bin/sh && ln -sf busybox ird/bin/poweroff
          printf '#!/bin/sh\necho DELULU_INIT_REACHED\n/bin/busybox poweroff -f\n' > ird/init && chmod +x ird/init
          (cd ird && find . | cpio -o -H newc 2>/dev/null | gzip) > initrd.gz
          cat > vm.json <<'JSON'
          { "boot-source": { "kernel_image_path": "vmlinux", "initrd_path": "initrd.gz",
                             "boot_args": "console=ttyS0 reboot=k panic=1 pci=off rdinit=/init" },
            "drives": [],
            "machine-config": { "vcpu_count": 1, "mem_size_mib": 128 } }
          JSON
          timeout 60 ./firecracker --no-api --config-file vm.json > boot.log 2>&1; echo "firecracker exit=$?"
          tail -20 boot.log
          if grep -q DELULU_INIT_REACHED boot.log; then echo "RESULT vmm-boot-to-init: PASS"; else echo "RESULT vmm-boot-to-init: FAIL"; fi

  macos-seatbelt-differential:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: a differential Seatbelt probe — the same operation with and without a deny profile
        continue-on-error: true
        run: |
          set +e
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          # Wait until the server answers: the first run's baseline timed out (exit 28), which voided
          # the differential (RW 4.18). The baseline must succeed for a sandboxed failure to mean anything.
          for i in $(seq 1 30); do curl -s -m 1 -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done
          curl -s -m 5 -o /dev/null http://127.0.0.1:8765/; plain=$?
          sandbox-exec -p '(version 1) (allow default) (deny network*)' /usr/bin/curl -s -m 5 -o /dev/null http://127.0.0.1:8765/; boxed=$?
          echo "network: plain exit=$plain boxed exit=$boxed"
          if [ $plain -eq 0 ] && [ $boxed -ne 0 ]; then echo "RESULT seatbelt-denies-network: PASS"; else echo "RESULT seatbelt-denies-network: FAIL"; fi
          T="$RUNNER_TEMP/sb"; mkdir -p "$T"
          /bin/sh -c "echo x > '$T/plain.txt'"; plain=$?
          sandbox-exec -p '(version 1) (allow default) (deny file-write*)' /bin/sh -c "echo x > '$T/boxed.txt'"; boxed=$?
          echo "file write: plain exit=$plain boxed exit=$boxed; boxed file exists: $(test -e "$T/boxed.txt" && echo yes || echo no)"
          if [ $plain -eq 0 ] && [ ! -e "$T/boxed.txt" ]; then echo "RESULT seatbelt-denies-write: PASS"; else echo "RESULT seatbelt-denies-write: FAIL"; fi
          /bin/cat /etc/hosts >/dev/null; plain=$?
          sandbox-exec -p '(version 1) (allow default) (deny file-read* (literal "/etc/hosts") (literal "/private/etc/hosts"))' /bin/cat /etc/hosts >/dev/null; boxed=$?
          echo "file read: plain exit=$plain boxed exit=$boxed"
          if [ $plain -eq 0 ] && [ $boxed -ne 0 ]; then echo "RESULT seatbelt-denies-read: PASS"; else echo "RESULT seatbelt-denies-read: FAIL"; fi

  # PS-B-03b (RW 4.21): can an unprivileged launcher give a Linux guest a SECOND identity here? A 0600
  # file owned by the runner is read twice: by a child mapped to the runner's own uid (the control,
  # which must read it — or nothing below measures separation) and by a child mapped to a SUBORDINATE
  # uid through newuidmap and /etc/subuid (`unshare --map-auto`), which must be refused.
  linux-subordinate-uid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: prerequisites, then a mapped read against a control
        continue-on-error: true
        run: |
          set +e
          me=$(id -un)
          echo "== util-linux =="; unshare --version
          echo "== newuidmap / newgidmap =="; ls -la "$(command -v newuidmap)" "$(command -v newgidmap)" 2>&1
          echo "== subuid / subgid for $me =="; grep "^$me:" /etc/subuid /etc/subgid 2>&1
          echo "== apparmor restrict unprivileged userns =="; cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1
          d=$(mktemp -d); echo operator > "$d/secret"; chmod 600 "$d/secret"; chmod 755 "$d"
          echo "== control: mapped to the runner's own uid =="
          unshare --user --map-root-user sh -c "id; cat $d/secret"; c=$?; echo "exit=$c"
          echo "== experiment: mapped to a subordinate uid =="
          unshare --user --map-auto --setuid 0 --setgid 0 sh -c "id; cat $d/secret"; e=$?; echo "exit=$e"
          if [ $c -ne 0 ]; then echo "RESULT subordinate-uid-separates: NOT MEASURED (the control could not run: control=$c)";
          elif [ $e -ne 0 ]; then echo "RESULT subordinate-uid-separates: PASS (control=$c experiment=$e)";
          else echo "RESULT subordinate-uid-separates: FAIL (the mapped child read the runner's file)"; fi
      # The first run (36167365278) measured the DEFAULT host: Ubuntu 24.04's AppArmor restriction
      # leaves an unprivileged user namespace without capabilities, so even the control could not write
      # its own uid_map. This step measures the host an OPERATOR has relaxed (the one sysctl such a
      # host would change), so the answer separates "the kernel cannot" from "this distribution won't".
      - name: the same, on a host whose operator relaxed the AppArmor userns restriction
        continue-on-error: true
        run: |
          set +e
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ls -la "$(command -v newgidmap)" 2>&1
          d=$(mktemp -d); echo operator > "$d/secret"; chmod 600 "$d/secret"; chmod 755 "$d"
          echo "== control: mapped to the runner's own uid =="
          unshare --user --map-root-user sh -c "id; cat $d/secret"; c=$?; echo "exit=$c"
          echo "== experiment: mapped to a subordinate uid =="
          unshare --user --map-auto --setuid 0 --setgid 0 sh -c "id; cat $d/secret"; e=$?; echo "exit=$e"
          echo "== the subordinate child can still read a world-readable binary and write its own pipe =="
          unshare --user --map-auto --setuid 0 --setgid 0 sh -c "/bin/true && echo reachable"; r=$?; echo "exit=$r"
          if [ $c -ne 0 ]; then echo "RESULT subordinate-uid-separates-relaxed: NOT MEASURED (control=$c)";
          elif [ $e -ne 0 ] && [ $r -eq 0 ]; then echo "RESULT subordinate-uid-separates-relaxed: PASS (control=$c experiment=$e reachable=$r)";
          else echo "RESULT subordinate-uid-separates-relaxed: FAIL (control=$c experiment=$e reachable=$r)"; fi

  windows-restricted-job-child:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: spawn a restricted-token child inside a Job Object, and test the job's one-process limit
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class RJ {
            [StructLayout(LayoutKind.Sequential)] public struct SI { public int cb; public IntPtr r, d, t; public int x, y, xs, ys, xc, yc, fill, flags; public short show, r2; public IntPtr r3, i, o, e; }
            [StructLayout(LayoutKind.Sequential)] public struct PI { public IntPtr hProcess, hThread; public int pid, tid; }
            [StructLayout(LayoutKind.Sequential)] public struct BASIC { public long a, b; public uint LimitFlags; public UIntPtr min, max; public uint ActiveProcessLimit; public UIntPtr aff; public uint pri, sched; }
            [StructLayout(LayoutKind.Sequential)] public struct IOC { public ulong a, b, c, d, e, f; }
            [StructLayout(LayoutKind.Sequential)] public struct EXT { public BASIC Basic; public IOC Io; public UIntPtr ProcessMemoryLimit, JobMemoryLimit, PeakP, PeakJ; }
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr p, uint a, out IntPtr t);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool CreateRestrictedToken(IntPtr t, uint f, uint a, IntPtr b, uint c, IntPtr d, uint e, IntPtr g, out IntPtr n);
            [DllImport("advapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)] static extern bool CreateProcessAsUserW(IntPtr t, string app, string cmd, IntPtr pa, IntPtr ta, bool inh, uint flags, IntPtr env, string dir, ref SI si, out PI pi);
            [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
            [DllImport("kernel32.dll", SetLastError=true)] static extern IntPtr CreateJobObjectW(IntPtr a, IntPtr n);
            [DllImport("kernel32.dll", SetLastError=true)] static extern bool SetInformationJobObject(IntPtr j, int c, ref EXT i, int l);
            [DllImport("kernel32.dll", SetLastError=true)] static extern bool AssignProcessToJobObject(IntPtr j, IntPtr p);
            [DllImport("kernel32.dll")] static extern uint ResumeThread(IntPtr t);
            [DllImport("kernel32.dll")] static extern uint WaitForSingleObject(IntPtr h, uint ms);
            [DllImport("kernel32.dll")] static extern bool GetExitCodeProcess(IntPtr h, out uint c);
            public static string Run(string cmd) {
              IntPtr tok, rt;
              if (!OpenProcessToken(GetCurrentProcess(), 0x0001|0x0002|0x0008, out tok)) return "OpenProcessToken err " + Marshal.GetLastWin32Error();
              if (!CreateRestrictedToken(tok, 0x1 /*DISABLE_MAX_PRIVILEGE*/, 0, IntPtr.Zero, 0, IntPtr.Zero, 0, IntPtr.Zero, out rt)) return "CreateRestrictedToken err " + Marshal.GetLastWin32Error();
              IntPtr job = CreateJobObjectW(IntPtr.Zero, IntPtr.Zero);
              var ext = new EXT(); ext.Basic.LimitFlags = 0x2000 | 0x0008 | 0x0100; ext.Basic.ActiveProcessLimit = 1; ext.ProcessMemoryLimit = (UIntPtr)(256UL<<20);
              if (!SetInformationJobObject(job, 9, ref ext, Marshal.SizeOf(typeof(EXT)))) return "SetInformationJobObject err " + Marshal.GetLastWin32Error();
              var si = new SI(); si.cb = Marshal.SizeOf(typeof(SI)); PI pi;
              if (!CreateProcessAsUserW(rt, null, cmd, IntPtr.Zero, IntPtr.Zero, false, 0x4 /*CREATE_SUSPENDED*/, IntPtr.Zero, null, ref si, out pi)) return "CreateProcessAsUser err " + Marshal.GetLastWin32Error();
              if (!AssignProcessToJobObject(job, pi.hProcess)) return "AssignProcessToJobObject err " + Marshal.GetLastWin32Error();
              ResumeThread(pi.hThread); WaitForSingleObject(pi.hProcess, 30000); uint code; GetExitCodeProcess(pi.hProcess, out code);
              return "exit " + code;
            }
          }
          '@
          $one = [RJ]::Run('cmd.exe /c exit 7')
          Write-Host "restricted child in a job: $one"
          if ($one -eq 'exit 7') { Write-Host 'RESULT windows-restricted-job-child: PASS' } else { Write-Host 'RESULT windows-restricted-job-child: FAIL' }
          # The job allows ONE process: a child that tries to start a grandchild must fail to.
          # `if errorlevel 9` means ">= 9", so a BLOCKED grandchild (cmd reports 1816 or 9009) also read as 9
          # (RW 4.18). Compare exactly, with delayed expansion, and pass any other code through to the log.
          $two = [RJ]::Run('cmd.exe /v:on /c "cmd.exe /c exit 9 & if !errorlevel! equ 9 (exit 9) else (exit !errorlevel!)"')
          Write-Host "grandchild attempt: $two"
          if ($two -ne 'exit 9') { Write-Host 'RESULT windows-job-one-process-limit: PASS' } else { Write-Host 'RESULT windows-job-one-process-limit: FAIL' }
  macos-seatbelt-guest-shape:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: under Seatbelt, can a confined process still use its own Unix socket?
        continue-on-error: true
        run: |
          set +e
          SOCK="$RUNNER_TEMP/guest.sock"
          rm -f "$SOCK"
          # A C client, so the answer is about the socket and not about an interpreter's startup.
          cat > "$RUNNER_TEMP/client.c" <<'CEOF'
          #include <stdio.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <unistd.h>
          int main(int argc, char **argv) {
            int fd = socket(AF_UNIX, SOCK_STREAM, 0);
            if (fd < 0) { perror("socket"); return 11; }
            struct sockaddr_un a; memset(&a, 0, sizeof a); a.sun_family = AF_UNIX;
            strncpy(a.sun_path, argv[1], sizeof a.sun_path - 1);
            if (connect(fd, (struct sockaddr *)&a, sizeof a) < 0) { perror("connect"); return 12; }
            char buf[16] = {0};
            ssize_t n = read(fd, buf, sizeof buf - 1);
            if (n <= 0) { perror("read"); return 13; }
            printf("GOT %s\n", buf);
            return 0;
          }
          CEOF
          cc -o "$RUNNER_TEMP/client" "$RUNNER_TEMP/client.c" || echo "RESULT seatbelt-client-build: FAIL"
          cat > "$RUNNER_TEMP/server.py" <<'PYEOF'
          import socket, sys
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.bind(sys.argv[1]); s.listen(4)
          while True:
              c, _ = s.accept(); c.sendall(b"hello"); c.close()
          PYEOF
          python3 "$RUNNER_TEMP/server.py" "$SOCK" &
          SRV=$!
          sleep 2
          echo "== unsandboxed baseline (must succeed, or the rest proves nothing) =="
          "$RUNNER_TEMP/client" "$SOCK"; plain=$?
          echo "baseline exit=$plain"

          # Shape A: deny by default, allow what a Mach-O binary needs to start, plus one socket.
          cat > "$RUNNER_TEMP/a.sb" <<SBEOF
          (version 1)
          (deny default)
          (allow process-exec*)
          (allow sysctl-read)
          (allow mach-lookup)
          (allow ipc-posix-shm*)
          (allow file-read-metadata)
          (allow file-read* (subpath "/usr/lib") (subpath "/System") (subpath "/private/var/db/dyld") (subpath "$RUNNER_TEMP"))
          (allow file-read* file-write* (literal "$SOCK"))
          (allow network-outbound (literal "$SOCK"))
          SBEOF
          sandbox-exec -f "$RUNNER_TEMP/a.sb" "$RUNNER_TEMP/client" "$SOCK"; a=$?
          echo "shape A (deny default) exit=$a"

          # Shape B: allow by default, deny the classes a guest must not have, keep the socket.
          cat > "$RUNNER_TEMP/b.sb" <<SBEOF
          (version 1)
          (allow default)
          (deny file-write*)
          (deny network*)
          (allow file-read* file-write* (literal "$SOCK"))
          (allow network-outbound (literal "$SOCK"))
          SBEOF
          sandbox-exec -f "$RUNNER_TEMP/b.sb" "$RUNNER_TEMP/client" "$SOCK"; b=$?
          echo "shape B (allow default, targeted denies) exit=$b"

          if [ $plain -eq 0 ] && [ $a -eq 0 ]; then echo "RESULT seatbelt-deny-default-allows-its-socket: PASS"; else echo "RESULT seatbelt-deny-default-allows-its-socket: FAIL"; fi
          if [ $plain -eq 0 ] && [ $b -eq 0 ]; then echo "RESULT seatbelt-allow-default-allows-its-socket: PASS"; else echo "RESULT seatbelt-allow-default-allows-its-socket: FAIL"; fi

          # The other half: shape B must still refuse a write outside the socket.
          sandbox-exec -f "$RUNNER_TEMP/b.sb" /bin/sh -c "echo x > $RUNNER_TEMP/should-not-exist" 2>/dev/null
          if [ ! -e "$RUNNER_TEMP/should-not-exist" ]; then echo "RESULT seatbelt-shapeB-denies-writes: PASS"; else echo "RESULT seatbelt-shapeB-denies-writes: FAIL"; fi

          echo "== what the system says it denied (the answer to WHY, when a shape fails) =="
          log show --style compact --last 3m --predicate 'process == "sandboxd" or senderImagePath contains "Sandbox"' 2>/dev/null | tail -40
          kill $SRV 2>/dev/null
  macos-seatbelt-bind-spellings:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: which Seatbelt rule lets a confined process bind its own Unix socket?
        continue-on-error: true
        run: |
          set +e
          cat > "$RUNNER_TEMP/server.c" <<'CEOF'
          #include <stdio.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <unistd.h>
          int main(int argc, char **argv) {
            unlink(argv[1]);
            int fd = socket(AF_UNIX, SOCK_STREAM, 0);
            if (fd < 0) { perror("socket"); return 11; }
            struct sockaddr_un a; memset(&a, 0, sizeof a); a.sun_family = AF_UNIX;
            strncpy(a.sun_path, argv[1], sizeof a.sun_path - 1);
            if (bind(fd, (struct sockaddr *)&a, sizeof a) < 0) { perror("bind"); return 12; }
            if (listen(fd, 1) < 0) { perror("listen"); return 13; }
            printf("BOUND\n");
            return 0;
          }
          CEOF
          cc -o "$RUNNER_TEMP/server" "$RUNNER_TEMP/server.c" || echo "RESULT bind-probe-build: FAIL"
          S="$RUNNER_TEMP/s.sock"
          try() {
            name="$1"; rules="$2"
            printf '(version 1)\n(allow default)\n(deny file-write*)\n(deny network*)\n(allow file-read* file-write* (literal "%s"))\n%s\n' "$S" "$rules" > "$RUNNER_TEMP/p.sb"
            rm -f "$S"
            sandbox-exec -f "$RUNNER_TEMP/p.sb" "$RUNNER_TEMP/server" "$S" >/dev/null 2>"$RUNNER_TEMP/err.txt"
            rc=$?
            if [ $rc -eq 0 ]; then echo "RESULT bind-$name: PASS"; else echo "RESULT bind-$name: FAIL rc=$rc $(head -c 120 "$RUNNER_TEMP/err.txt")"; fi
          }
          try "literal-network-bind" "(allow network-bind (literal \"$S\"))"
          try "local-path" "(allow network-bind (local (literal \"$S\")))"
          try "network-star-literal" "(allow network* (literal \"$S\"))"
          try "network-inbound-too" "(allow network-bind network-inbound network-outbound (literal \"$S\"))"
          # And the baseline: no network denial at all, which is what the jail ships with today.
          printf '(version 1)\n(allow default)\n(deny file-write*)\n(allow file-read* file-write* (literal "%s"))\n' "$S" > "$RUNNER_TEMP/p.sb"
          rm -f "$S"
          sandbox-exec -f "$RUNNER_TEMP/p.sb" "$RUNNER_TEMP/server" "$S" >/dev/null 2>&1
          if [ $? -eq 0 ]; then echo "RESULT bind-no-network-denial: PASS"; else echo "RESULT bind-no-network-denial: FAIL"; fi

  # ---- PS-A2 experiment (2026-09-20): can the macOS guest profile be DENY-DEFAULT?
  #
  # The profile the jail ships today is allow-default with targeted denies, because a deny-default
  # profile killed even a plain C program before it reached its socket (run 35391102215, exit 134 =
  # SIGABRT, i.e. dyld or libSystem was refused something it needs). That is a measured fact, not a
  # verdict on deny-default: it says the allow list was too short, and says nothing about WHICH
  # clause was missing. So this is a LADDER. Each rung adds one allowance and reports whether the
  # process reached its socket, with the stderr head when it did not, so the answer is read off the
  # runner rather than guessed from documentation.
  #
  # Two probes, because they fail for different reasons: a tiny C binary (dyld plus libSystem only)
  # and the real `delulu` guest (CPython, wasmtime, threads). A profile that carries the first and
  # not the second is not a profile this project can ship.
  macos-seatbelt-deny-default-ladder:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: the smallest deny-default profile a Mach-O binary can still start under
        continue-on-error: true
        run: |
          set +e
          cat > "$RUNNER_TEMP/server.c" <<'CEOF'
          #include <stdio.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <unistd.h>
          int main(int argc, char **argv) {
            unlink(argv[1]);
            int fd = socket(AF_UNIX, SOCK_STREAM, 0);
            if (fd < 0) { perror("socket"); return 11; }
            struct sockaddr_un a; memset(&a, 0, sizeof a); a.sun_family = AF_UNIX;
            strncpy(a.sun_path, argv[1], sizeof a.sun_path - 1);
            if (bind(fd, (struct sockaddr *)&a, sizeof a) < 0) { perror("bind"); return 12; }
            if (listen(fd, 1) < 0) { perror("listen"); return 13; }
            printf("BOUND\n");
            return 0;
          }
          CEOF
          cc -o "$RUNNER_TEMP/server" "$RUNNER_TEMP/server.c" || echo "RESULT ladder-build: FAIL"
          EXE="$RUNNER_TEMP/server"
          D="$RUNNER_TEMP/chan"; mkdir -p "$D"
          # Seatbelt matches the RESOLVED path: /var/folders resolves to /private/var/folders, and a
          # profile naming only the unresolved spelling matches nothing (run 35394515395). Both are
          # named here for the same reason the shipped profile names both.
          RD=$(cd "$D" && pwd -P)
          S="$D/s.sock"; RS="$RD/s.sock"
          echo "== paths =="; echo "exe=$EXE dir=$D resolved=$RD"
          # Rung 0 is the shape that is known to abort, kept as the CONTROL: without it a later PASS
          # says nothing about which clause earned it.
          R0='(allow process-exec (literal "'"$EXE"'"))'
          R0="$R0
          (allow network-bind network-outbound (literal \"$S\") (literal \"$RS\"))
          (allow file-read* file-write* (literal \"$S\") (literal \"$RS\"))"
          # Each rung is the previous one plus one clause, named after the clause it adds.
          RUNG_read='(allow file-read*)'
          RUNG_map='(allow file-map-executable)'
          RUNG_mach='(allow mach-lookup)'
          RUNG_sysctl='(allow sysctl-read)'
          RUNG_self='(allow signal (target self)) (allow process-info* (target self)) (allow ipc-posix-shm)'
          RUNG_meta='(allow file-read-metadata)'
          try() {
            name="$1"; rules="$2"; exe="$3"; shift 3
            printf '(version 1)\n(deny default)\n%s\n%s\n' "$R0" "$rules" > "$RUNNER_TEMP/p.sb"
            rm -f "$S"
            # macOS ships no GNU `timeout`; perl's alarm survives the exec, so the SANDBOXED
            # process is the one that receives the signal. (The first run of this experiment
            # reported every rung FAIL rc=127 — `timeout: command not found`. The control line said
            # "the probe itself is wrong", which is what a control is for.)
            perl -e 'alarm shift; exec @ARGV or exit 127' 20 sandbox-exec -f "$RUNNER_TEMP/p.sb" "$exe" "$@" > "$RUNNER_TEMP/o.txt" 2> "$RUNNER_TEMP/e.txt"
            rc=$?
            if [ -S "$S" ]; then
              echo "RESULT $name: PASS rc=$rc"
            else
              echo "RESULT $name: FAIL rc=$rc err=$(tr '\n' '|' < "$RUNNER_TEMP/e.txt" | head -c 200)"
            fi
          }
          A=""
          for step in read map mach sysctl self meta; do
            eval "clause=\$RUNG_$step"
            A="$A
          $clause"
            try "c-ladder-$step" "$A" "$EXE" "$S"
          done
          echo "== the accumulated profile that was reached =="
          cat "$RUNNER_TEMP/p.sb"
          # And the narrowed form: the same allowances, but reads confined to the system paths rather
          # than to everything. This is the one worth shipping if it holds.
          NARROW="(allow file-read* (subpath \"/usr\") (subpath \"/System\") (subpath \"/Library\") (subpath \"/private/etc\") (subpath \"/dev\") (literal \"$EXE\") (subpath \"$RD\"))
          $RUNG_map
          $RUNG_mach
          $RUNG_sysctl
          $RUNG_self
          $RUNG_meta"
          try "c-narrowed-reads" "$NARROW" "$EXE" "$S"

      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: does the REAL guest start under the same profile?
        continue-on-error: true
        run: |
          set +e
          cargo build -p delulu --bin delulu 2>&1 | tail -5
          EXE="$PWD/target/debug/delulu"
          ls -la "$EXE" || { echo "RESULT real-build: FAIL"; exit 0; }
          D="$RUNNER_TEMP/rchan"; rm -rf "$D"; mkdir -p "$D"
          RD=$(cd "$D" && pwd -P)
          S="$D/broker.sock"; RS="$RD/broker.sock"
          RE=$(cd "$(dirname "$EXE")" && pwd -P)/delulu
          base="(allow process-exec (literal \"$EXE\") (literal \"$RE\"))
          (allow network-bind network-outbound (literal \"$S\") (literal \"$RS\"))
          (allow file-read* file-write* (literal \"$S\") (literal \"$RS\") (subpath \"$D\") (subpath \"$RD\"))
          (allow file-map-executable)
          (allow mach-lookup)
          (allow sysctl-read)
          (allow signal (target self))
          (allow process-info* (target self))
          (allow ipc-posix-shm)
          (allow file-read-metadata)"
          real_try() {
            name="$1"; reads="$2"
            printf '(version 1)\n(deny default)\n%s\n%s\n' "$base" "$reads" > "$RUNNER_TEMP/r.sb"
            rm -f "$S"
            # The guest binds its channel and then waits for a hello it will never get, so the SOCKET
            # is the evidence: if it exists, the binary loaded, ran and bound under this profile.
            DELULU_NO_FIRST_RUN=1 perl -e 'alarm shift; exec @ARGV or exit 127' 20 sandbox-exec -f "$RUNNER_TEMP/r.sb" "$EXE" __guest "$D" > "$RUNNER_TEMP/ro.txt" 2> "$RUNNER_TEMP/re.txt"
            rc=$?
            if [ -S "$S" ]; then
              echo "RESULT $name: PASS rc=$rc"
            else
              echo "RESULT $name: FAIL rc=$rc err=$(tr '\n' '|' < "$RUNNER_TEMP/re.txt" | head -c 300)"
            fi
          }
          real_try "real-reads-everything" '(allow file-read*)'
          real_try "real-reads-system-only" "(allow file-read* (subpath \"/usr\") (subpath \"/System\") (subpath \"/Library\") (subpath \"/private/etc\") (subpath \"/dev\") (literal \"$EXE\") (subpath \"$(dirname "$EXE")\") (subpath \"$RE\"))"
          # The CONTROL, without which a PASS above proves nothing about the profile: the same guest,
          # no profile at all, must bind.
          rm -f "$S"
          DELULU_NO_FIRST_RUN=1 perl -e 'alarm shift; exec @ARGV or exit 127' 20 "$EXE" __guest "$D" > /dev/null 2>&1
          if [ -S "$S" ]; then echo "RESULT real-unconfined-control: PASS"; else echo "RESULT real-unconfined-control: FAIL — the probe itself is wrong"; fi

  # ---- PS-A2 experiment, round two (2026-09-20). Round one answered the big question:
  #
  #   RESULT real-reads-everything: PASS rc=142
  #
  # The REAL guest — CPython, wasmtime, threads and all — starts and binds its channel under a
  # DENY-DEFAULT Seatbelt profile, and rc 142 is this probe's own alarm killing it while it waited for
  # a hello that never comes, which is exactly the shape of success. So the belief that deny-default
  # aborts a Mach-O binary was wrong; the missing clause was `(allow file-read*)`, and the earlier
  # exit 134 was measuring an allow list that was too short, not a limit of Seatbelt.
  #
  # Round one also found the boundary: narrowing reads to /usr, /System, /Library, /private/etc and
  # /dev aborts (rc 134) for BOTH the C probe and the real guest, so something outside those is read
  # during startup. This round finds what, and trims every other allowance to the ones actually
  # required — because a profile with a clause nobody needs is a profile nobody can reason about.
  macos-seatbelt-deny-default-narrowing:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: which reads does startup need, and which allowances are load-bearing?
        continue-on-error: true
        run: |
          set +e
          cargo build -p delulu --bin delulu 2>&1 | tail -3
          EXE="$PWD/target/debug/delulu"
          ls -la "$EXE" || { echo "RESULT round2-build: FAIL"; exit 0; }
          RE=$(cd "$(dirname "$EXE")" && pwd -P)/delulu
          D="$RUNNER_TEMP/n"; rm -rf "$D"; mkdir -p "$D"
          RD=$(cd "$D" && pwd -P)
          S="$D/broker.sock"; RS="$RD/broker.sock"
          echo "== paths =="; echo "exe=$EXE resolved=$RE dir=$D resolved=$RD"

          # One clause per line, so a rung can drop exactly one of them.
          C_exec="(allow process-exec (literal \"$EXE\") (literal \"$RE\"))"
          C_net="(allow network-bind network-outbound (literal \"$S\") (literal \"$RS\"))"
          C_sockdir="(allow file-read* file-write* (literal \"$S\") (literal \"$RS\") (subpath \"$D\") (subpath \"$RD\"))"
          C_sockonly="(allow file-read* file-write* (literal \"$S\") (literal \"$RS\"))"
          C_map="(allow file-map-executable)"
          C_mach="(allow mach-lookup)"
          C_sysctl="(allow sysctl-read)"
          C_self="(allow signal (target self)) (allow process-info* (target self)) (allow ipc-posix-shm)"
          C_meta="(allow file-read-metadata)"
          READ_ALL="(allow file-read*)"
          READ_SYS="(allow file-read* (subpath \"/usr\") (subpath \"/System\") (subpath \"/Library\") (subpath \"/private/etc\") (subpath \"/dev\") (literal \"$EXE\") (literal \"$RE\") (subpath \"$(dirname "$EXE")\"))"

          try() {
            name="$1"; shift
            : > "$RUNNER_TEMP/p.sb"
            printf '(version 1)\n(deny default)\n' >> "$RUNNER_TEMP/p.sb"
            for c in "$@"; do printf '%s\n' "$c" >> "$RUNNER_TEMP/p.sb"; done
            rm -f "$S"
            # The socket file is the evidence: it exists only if the binary loaded, ran and bound.
            # macOS has no GNU `timeout`; perl's alarm survives the exec, so the sandboxed process is
            # the one that receives the signal.
            DELULU_NO_FIRST_RUN=1 perl -e 'alarm shift; exec @ARGV or exit 127' 15 \
              sandbox-exec -f "$RUNNER_TEMP/p.sb" "$EXE" __guest "$D" > /dev/null 2> "$RUNNER_TEMP/e.txt"
            rc=$?
            if [ -S "$S" ]; then echo "RESULT $name: PASS rc=$rc"; else echo "RESULT $name: FAIL rc=$rc err=$(tr '\n' '|' < "$RUNNER_TEMP/e.txt" | head -c 200)"; fi
          }

          # The profile round one proved works, as the baseline every rung below is compared against.
          WORKS="$C_exec|$C_net|$C_sockdir|$C_map|$C_mach|$C_sysctl|$C_self|$C_meta|$READ_ALL"
          try "baseline-known-good" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_ALL"

          # 1. Do writes need the channel DIRECTORY, or only the socket file?
          try "writes-socket-only" "$C_exec" "$C_net" "$C_sockonly" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_ALL"

          # 2. Which extra read roots make the narrowed form work?
          try "reads-system-only" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_SYS"
          try "reads-plus-var-db" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_SYS" '(allow file-read* (subpath "/private/var/db"))'
          try "reads-plus-var-db-and-folders" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_SYS" '(allow file-read* (subpath "/private/var/db") (subpath "/private/var/folders"))'
          try "reads-plus-var-and-opt-and-cores" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_SYS" '(allow file-read* (subpath "/private/var") (subpath "/opt") (subpath "/Applications/Xcode.app") (subpath "/private/tmp"))'

          # 3. Trim: drop ONE allowance from the known-good profile at a time. A rung that still
          #    PASSES names a clause the profile does not need and should not carry.
          try "trim-no-map" "$C_exec" "$C_net" "$C_sockdir" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_ALL"
          try "trim-no-mach" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_sysctl" "$C_self" "$C_meta" "$READ_ALL"
          try "trim-no-sysctl" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_self" "$C_meta" "$READ_ALL"
          try "trim-no-self" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_meta" "$READ_ALL"
          try "trim-no-meta" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$READ_ALL"
          try "trim-no-exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_ALL"

          # 4. The negative controls, without which every PASS above could be the profile doing
          #    nothing at all: a profile that denies the socket must FAIL, and one that denies reads
          #    must FAIL. If either passes, `sandbox-exec` is not applying this profile.
          try "control-no-socket-rules" "$C_exec" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta" "$READ_ALL"
          try "control-no-reads" "$C_exec" "$C_net" "$C_sockdir" "$C_map" "$C_mach" "$C_sysctl" "$C_self" "$C_meta"
          echo "== the last profile written =="; cat "$RUNNER_TEMP/p.sb"

  # ---- PS-A2 experiment, round three (2026-09-20): does macOS actually enforce these rlimits?
  #
  # The macOS guest now gets `RLIMIT_CPU` and `RLIMIT_CORE` before `exec`, and the run REPORTS a
  # processor-time ceiling. A report may only claim what was measured (PS-0-04), and the claim here is
  # load-bearing in a way it is not elsewhere: macOS has no `PR_SET_PDEATHSIG`, so a guest that is
  # computing and asking for nothing would not notice its host had died, and this ceiling is the only
  # bound on that orphan. If macOS does not enforce it, the claim comes back out of the report.
  #
  # `RLIMIT_DATA` is requested by the jail but deliberately NOT claimed. This measures it too, so the
  # decision not to claim it is a measured one rather than a cautious guess.
  macos-rlimit-enforcement:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: does macOS kill a spinning child on RLIMIT_CPU, and does RLIMIT_DATA bite?
        continue-on-error: true
        run: |
          set +e
          cat > "$RUNNER_TEMP/spin.c" <<'CEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/resource.h>
          #include <sys/time.h>
          #include <unistd.h>
          // argv[1] = "cpu" | "data" | "none"
          int main(int argc, char **argv) {
            const char *mode = argc > 1 ? argv[1] : "none";
            if (strcmp(mode, "cpu") == 0) {
              struct rlimit r; r.rlim_cur = 1; r.rlim_max = 1;
              if (setrlimit(RLIMIT_CPU, &r) != 0) { perror("setrlimit cpu"); return 20; }
            }
            if (strcmp(mode, "data") == 0) {
              struct rlimit r; r.rlim_cur = 8u * 1024 * 1024; r.rlim_max = 8u * 1024 * 1024;
              if (setrlimit(RLIMIT_DATA, &r) != 0) { perror("setrlimit data"); return 21; }
              // Ask for far more than the limit, in chunks, TOUCHING each one so a lazy mapping is
              // not mistaken for an enforced one.
              for (int i = 0; i < 64; i++) {
                char *p = (char *)malloc(8u * 1024 * 1024);
                if (!p) { printf("MALLOC_REFUSED_AT %d\n", i); return 0; }
                memset(p, i & 0xff, 8u * 1024 * 1024);
              }
              printf("ALLOCATED_512MB_UNDER_8MB_LIMIT\n");
              return 0;
            }
            // Spin for what would be about four seconds of processor time.
            volatile double x = 1.0;
            for (long i = 0; i < 4000000000L; i++) { x = x * 1.0000001 + 1.0; if (x > 1e300) x = 1.0; }
            printf("SPUN_TO_COMPLETION %f\n", (double)x);
            return 0;
          }
          CEOF
          cc -O1 -o "$RUNNER_TEMP/spin" "$RUNNER_TEMP/spin.c" || echo "RESULT rlimit-probe-build: FAIL"

          # The CONTROL first: without a limit the spinner must run for several seconds and finish (or
          # at least not be killed by a signal). Without this line, "killed" below could mean the
          # program simply crashes on this runner.
          start=$(date +%s)
          "$RUNNER_TEMP/spin" none > "$RUNNER_TEMP/o.txt" 2>&1
          rc=$?; elapsed=$(( $(date +%s) - start ))
          echo "control: rc=$rc elapsed=${elapsed}s out=$(head -c 80 "$RUNNER_TEMP/o.txt")"
          if [ $rc -eq 0 ]; then echo "RESULT rlimit-control-runs-unlimited: PASS ${elapsed}s"; else echo "RESULT rlimit-control-runs-unlimited: FAIL rc=$rc"; fi

          # RLIMIT_CPU = 1 second against the same spinner. Killed by SIGXCPU is rc 152 (128+24);
          # some systems deliver SIGKILL (137) once the hard limit is reached.
          start=$(date +%s)
          "$RUNNER_TEMP/spin" cpu > "$RUNNER_TEMP/o2.txt" 2>&1
          rc=$?; elapsed=$(( $(date +%s) - start ))
          echo "cpu: rc=$rc elapsed=${elapsed}s out=$(head -c 80 "$RUNNER_TEMP/o2.txt")"
          if [ $rc -ge 128 ] && [ $elapsed -le 5 ]; then
            echo "RESULT macos-rlimit-cpu-kills-a-spinner: PASS rc=$rc after ${elapsed}s"
          else
            echo "RESULT macos-rlimit-cpu-kills-a-spinner: FAIL rc=$rc after ${elapsed}s — the run report must stop claiming a processor-time ceiling on macOS"
          fi

          # RLIMIT_DATA = 8 MiB against 512 MiB of touched allocations. A PASS here would mean the
          # jail could honestly claim a memory ceiling on macOS too; the expectation is that it does
          # not bite, which is exactly why the claim is currently withheld.
          "$RUNNER_TEMP/spin" data > "$RUNNER_TEMP/o3.txt" 2>&1
          rc=$?
          echo "data: rc=$rc out=$(head -c 120 "$RUNNER_TEMP/o3.txt")"
          if grep -q MALLOC_REFUSED_AT "$RUNNER_TEMP/o3.txt"; then
            echo "RESULT macos-rlimit-data-bites: PASS — a memory ceiling COULD be claimed on macOS"
          else
            echo "RESULT macos-rlimit-data-bites: FAIL — not enforced, so withholding the memory-ceiling claim is correct"
          fi

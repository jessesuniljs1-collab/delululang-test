# Host-capability probe for the sandbox research pass (docs/archive/v1/NEXT_EVOLUTION_2026/SANDBOX_RESEARCH.md).
#
# Runs ONLY by hand (workflow_dispatch). It builds nothing and tests nothing: it prints what each
# GitHub-hosted runner actually offers an execution sandbox — KVM, unprivileged user namespaces,
# the Landlock ABI, hypervisor support on macOS, the Windows Hypervisor Platform / Hyper-V state.
# Every step is `continue-on-error` so a missing capability is a recorded fact, never a red run.
# The result is read with `gh run view` and transcribed into the research record; "activated" is
# not "executed", and an unread run is evidence of nothing.
# PS-0-08 added three EXPERIMENTS (KVM + a fetched Firecracker booted to /init; a differential Seatbelt
# probe; a restricted-token child inside a Job Object). Each prints `RESULT <name>: PASS|FAIL` lines.
name: host-capability-probe
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: kernel, kvm, user namespaces, landlock
        continue-on-error: true
        run: |
          set +e
          echo "== kernel =="; uname -r
          echo "== /dev/kvm =="; ls -la /dev/kvm 2>&1; echo "exit=$?"
          echo "== cpu virt flags =="; grep -c -E 'vmx|svm' /proc/cpuinfo
          echo "== kvm-ok (if present) =="; command -v kvm-ok && kvm-ok 2>&1
          echo "== unprivileged user namespaces =="; cat /proc/sys/kernel/unprivileged_userns_clone 2>&1; cat /proc/sys/user/max_user_namespaces 2>&1
          echo "== apparmor restrict unprivileged userns =="; cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1
          echo "== unshare -Ur true =="; unshare -Ur true; echo "exit=$?"
          echo "== unshare -Urm true (mount ns) =="; unshare -Urm true; echo "exit=$?"
          echo "== unshare -Urn true (net ns) =="; unshare -Urn true; echo "exit=$?"
          echo "== landlock ABI (via python ctypes landlock_create_ruleset LANDLOCK_CREATE_RULESET_VERSION) =="
          python3 - <<'PY'
          import ctypes, os
          libc = ctypes.CDLL(None, use_errno=True)
          SYS_landlock_create_ruleset = 444
          r = libc.syscall(SYS_landlock_create_ruleset, None, 0, 1)
          print("landlock ABI version:", r, "errno:", ctypes.get_errno())
          PY
          echo "== seccomp =="; grep -i seccomp /proc/self/status
          echo "== bwrap / firecracker / cloud-hypervisor / virtiofsd / docker / runsc on PATH =="; for b in bwrap firecracker cloud-hypervisor virtiofsd docker runsc podman; do printf "%s: " "$b"; command -v $b || echo "absent"; done
          echo "== cgroup v2 =="; stat -fc %T /sys/fs/cgroup 2>&1; cat /sys/fs/cgroup/cgroup.controllers 2>&1
          echo "== systemd-run --user available? =="; systemd-run --user --scope -p MemoryMax=64M true 2>&1; echo "exit=$?"
          echo "== nproc / mem =="; nproc; free -m | head -2
  macos:
    runs-on: macos-latest
    steps:
      - name: hypervisor support, sandbox-exec, arch
        continue-on-error: true
        run: |
          set +e
          echo "== sw_vers =="; sw_vers
          echo "== arch =="; uname -m
          echo "== kern.hv_support =="; sysctl kern.hv_support 2>&1
          echo "== sandbox-exec present =="; ls -la /usr/bin/sandbox-exec 2>&1
          echo "== sandbox-exec deny-all can run /bin/echo? =="; sandbox-exec -p '(version 1) (deny default) (allow process-exec (literal "/bin/echo")) (allow file-read* (literal "/bin/echo") (subpath "/usr/lib") (subpath "/System/Library"))' /bin/echo hi 2>&1; echo "exit=$?"
          echo "== sandbox-exec: network denied? (curl to localhost should fail) =="; sandbox-exec -p '(version 1) (deny default) (allow process-exec*) (allow file-read*) (deny network*)' /usr/bin/curl -s -m 3 http://127.0.0.1:1/ 2>&1; echo "exit=$?"
          echo "== virtualization entitlement helpers: container CLI? =="; command -v container || echo "absent"
          echo "== nproc / mem =="; sysctl -n hw.ncpu hw.memsize
  windows:
    runs-on: windows-latest
    steps:
      - name: hyper-v / WHP / job objects / appcontainer
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "== OS =="; (Get-CimInstance Win32_OperatingSystem).Caption; [Environment]::OSVersion.Version
          Write-Host "== hypervisor present (systeminfo Hyper-V section) =="; systeminfo | Select-String -Pattern 'Hyper-V|Virtualization'
          Write-Host "== optional features (HypervisorPlatform, Microsoft-Hyper-V, Containers, VirtualMachinePlatform) =="
          foreach ($f in 'HypervisorPlatform','Microsoft-Hyper-V-All','Containers','VirtualMachinePlatform','Microsoft-Windows-Subsystem-Linux') { try { $s = (Get-WindowsOptionalFeature -Online -FeatureName $f -ErrorAction Stop).State; Write-Host "$f : $s" } catch { Write-Host "$f : query failed ($($_.Exception.Message))" } }
          Write-Host "== is this session admin? =="; ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "== docker on PATH =="; Get-Command docker -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          Write-Host "== nproc / mem =="; $env:NUMBER_OF_PROCESSORS; (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory

  # ---- PS-0-08 experiments (2026-09-18). Each prints a verdict line `RESULT <name>: <PASS|FAIL> …`
  # that the head chef transcribes; `continue-on-error` keeps a missing capability a fact, not a red run.
  linux-kvm-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: can this runner open /dev/kvm, and boot a fetched VMM to /init?
        continue-on-error: true
        run: |
          set +e
          echo "== /dev/kvm before =="; ls -la /dev/kvm
          python3 - <<'PY'
          import os, fcntl
          try:
              fd = os.open("/dev/kvm", os.O_RDWR)
              v = fcntl.ioctl(fd, 0xAE00)  # KVM_GET_API_VERSION
              print("RESULT kvm-open-as-runner: PASS api", v)
          except Exception as e:
              print("RESULT kvm-open-as-runner: FAIL", e)
          PY
          # The runner user may not be in the kvm group; record, then grant it for the boot attempt.
          sudo chmod 666 /dev/kvm; ls -la /dev/kvm
          python3 -c 'import os,fcntl; fd=os.open("/dev/kvm",os.O_RDWR); print("RESULT kvm-open-after-chmod: PASS api", fcntl.ioctl(fd,0xAE00))' || echo "RESULT kvm-open-after-chmod: FAIL"
          ARCH=$(uname -m); FC=v1.10.1
          curl -fsSL -o fc.tgz "https://github.com/firecracker-microvm/firecracker/releases/download/${FC}/firecracker-${FC}-${ARCH}.tgz" || echo "RESULT vmm-fetch: FAIL"
          tar xzf fc.tgz && cp release-${FC}-${ARCH}/firecracker-${FC}-${ARCH} ./firecracker && ./firecracker --version | head -1
          curl -fsSL -o vmlinux "https://s3.amazonaws.com/spec.ccfc.min/img/quickstart_guide/${ARCH}/kernels/vmlinux.bin" || echo "RESULT kernel-fetch: FAIL"
          # A kernel-only image whose /init prints a marker and powers off — the shape PS-C boots.
          sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq busybox-static cpio >/dev/null
          mkdir -p ird/bin && cp /bin/busybox ird/bin/ && ln -sf busybox ird/bin/sh && ln -sf busybox ird/bin/poweroff
          printf '#!/bin/sh\necho DELULU_INIT_REACHED\n/bin/busybox poweroff -f\n' > ird/init && chmod +x ird/init
          (cd ird && find . | cpio -o -H newc 2>/dev/null | gzip) > initrd.gz
          cat > vm.json <<'JSON'
          { "boot-source": { "kernel_image_path": "vmlinux", "initrd_path": "initrd.gz",
                             "boot_args": "console=ttyS0 reboot=k panic=1 pci=off rdinit=/init" },
            "drives": [],
            "machine-config": { "vcpu_count": 1, "mem_size_mib": 128 } }
          JSON
          timeout 60 ./firecracker --no-api --config-file vm.json > boot.log 2>&1; echo "firecracker exit=$?"
          tail -20 boot.log
          if grep -q DELULU_INIT_REACHED boot.log; then echo "RESULT vmm-boot-to-init: PASS"; else echo "RESULT vmm-boot-to-init: FAIL"; fi

  macos-seatbelt-differential:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: a differential Seatbelt probe — the same operation with and without a deny profile
        continue-on-error: true
        run: |
          set +e
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          # Wait until the server answers: the first run's baseline timed out (exit 28), which voided
          # the differential (RW 4.18). The baseline must succeed for a sandboxed failure to mean anything.
          for i in $(seq 1 30); do curl -s -m 1 -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done
          curl -s -m 5 -o /dev/null http://127.0.0.1:8765/; plain=$?
          sandbox-exec -p '(version 1) (allow default) (deny network*)' /usr/bin/curl -s -m 5 -o /dev/null http://127.0.0.1:8765/; boxed=$?
          echo "network: plain exit=$plain boxed exit=$boxed"
          if [ $plain -eq 0 ] && [ $boxed -ne 0 ]; then echo "RESULT seatbelt-denies-network: PASS"; else echo "RESULT seatbelt-denies-network: FAIL"; fi
          T="$RUNNER_TEMP/sb"; mkdir -p "$T"
          /bin/sh -c "echo x > '$T/plain.txt'"; plain=$?
          sandbox-exec -p '(version 1) (allow default) (deny file-write*)' /bin/sh -c "echo x > '$T/boxed.txt'"; boxed=$?
          echo "file write: plain exit=$plain boxed exit=$boxed; boxed file exists: $(test -e "$T/boxed.txt" && echo yes || echo no)"
          if [ $plain -eq 0 ] && [ ! -e "$T/boxed.txt" ]; then echo "RESULT seatbelt-denies-write: PASS"; else echo "RESULT seatbelt-denies-write: FAIL"; fi
          /bin/cat /etc/hosts >/dev/null; plain=$?
          sandbox-exec -p '(version 1) (allow default) (deny file-read* (literal "/etc/hosts") (literal "/private/etc/hosts"))' /bin/cat /etc/hosts >/dev/null; boxed=$?
          echo "file read: plain exit=$plain boxed exit=$boxed"
          if [ $plain -eq 0 ] && [ $boxed -ne 0 ]; then echo "RESULT seatbelt-denies-read: PASS"; else echo "RESULT seatbelt-denies-read: FAIL"; fi

  windows-restricted-job-child:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: spawn a restricted-token child inside a Job Object, and test the job's one-process limit
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class RJ {
            [StructLayout(LayoutKind.Sequential)] public struct SI { public int cb; public IntPtr r, d, t; public int x, y, xs, ys, xc, yc, fill, flags; public short show, r2; public IntPtr r3, i, o, e; }
            [StructLayout(LayoutKind.Sequential)] public struct PI { public IntPtr hProcess, hThread; public int pid, tid; }
            [StructLayout(LayoutKind.Sequential)] public struct BASIC { public long a, b; public uint LimitFlags; public UIntPtr min, max; public uint ActiveProcessLimit; public UIntPtr aff; public uint pri, sched; }
            [StructLayout(LayoutKind.Sequential)] public struct IOC { public ulong a, b, c, d, e, f; }
            [StructLayout(LayoutKind.Sequential)] public struct EXT { public BASIC Basic; public IOC Io; public UIntPtr ProcessMemoryLimit, JobMemoryLimit, PeakP, PeakJ; }
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr p, uint a, out IntPtr t);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool CreateRestrictedToken(IntPtr t, uint f, uint a, IntPtr b, uint c, IntPtr d, uint e, IntPtr g, out IntPtr n);
            [DllImport("advapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)] static extern bool CreateProcessAsUserW(IntPtr t, string app, string cmd, IntPtr pa, IntPtr ta, bool inh, uint flags, IntPtr env, string dir, ref SI si, out PI pi);
            [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
            [DllImport("kernel32.dll", SetLastError=true)] static extern IntPtr CreateJobObjectW(IntPtr a, IntPtr n);
            [DllImport("kernel32.dll", SetLastError=true)] static extern bool SetInformationJobObject(IntPtr j, int c, ref EXT i, int l);
            [DllImport("kernel32.dll", SetLastError=true)] static extern bool AssignProcessToJobObject(IntPtr j, IntPtr p);
            [DllImport("kernel32.dll")] static extern uint ResumeThread(IntPtr t);
            [DllImport("kernel32.dll")] static extern uint WaitForSingleObject(IntPtr h, uint ms);
            [DllImport("kernel32.dll")] static extern bool GetExitCodeProcess(IntPtr h, out uint c);
            public static string Run(string cmd) {
              IntPtr tok, rt;
              if (!OpenProcessToken(GetCurrentProcess(), 0x0001|0x0002|0x0008, out tok)) return "OpenProcessToken err " + Marshal.GetLastWin32Error();
              if (!CreateRestrictedToken(tok, 0x1 /*DISABLE_MAX_PRIVILEGE*/, 0, IntPtr.Zero, 0, IntPtr.Zero, 0, IntPtr.Zero, out rt)) return "CreateRestrictedToken err " + Marshal.GetLastWin32Error();
              IntPtr job = CreateJobObjectW(IntPtr.Zero, IntPtr.Zero);
              var ext = new EXT(); ext.Basic.LimitFlags = 0x2000 | 0x0008 | 0x0100; ext.Basic.ActiveProcessLimit = 1; ext.ProcessMemoryLimit = (UIntPtr)(256UL<<20);
              if (!SetInformationJobObject(job, 9, ref ext, Marshal.SizeOf(typeof(EXT)))) return "SetInformationJobObject err " + Marshal.GetLastWin32Error();
              var si = new SI(); si.cb = Marshal.SizeOf(typeof(SI)); PI pi;
              if (!CreateProcessAsUserW(rt, null, cmd, IntPtr.Zero, IntPtr.Zero, false, 0x4 /*CREATE_SUSPENDED*/, IntPtr.Zero, null, ref si, out pi)) return "CreateProcessAsUser err " + Marshal.GetLastWin32Error();
              if (!AssignProcessToJobObject(job, pi.hProcess)) return "AssignProcessToJobObject err " + Marshal.GetLastWin32Error();
              ResumeThread(pi.hThread); WaitForSingleObject(pi.hProcess, 30000); uint code; GetExitCodeProcess(pi.hProcess, out code);
              return "exit " + code;
            }
          }
          '@
          $one = [RJ]::Run('cmd.exe /c exit 7')
          Write-Host "restricted child in a job: $one"
          if ($one -eq 'exit 7') { Write-Host 'RESULT windows-restricted-job-child: PASS' } else { Write-Host 'RESULT windows-restricted-job-child: FAIL' }
          # The job allows ONE process: a child that tries to start a grandchild must fail to.
          # `if errorlevel 9` means ">= 9", so a BLOCKED grandchild (cmd reports 1816 or 9009) also read as 9
          # (RW 4.18). Compare exactly, with delayed expansion, and pass any other code through to the log.
          $two = [RJ]::Run('cmd.exe /v:on /c "cmd.exe /c exit 9 & if !errorlevel! equ 9 (exit 9) else (exit !errorlevel!)"')
          Write-Host "grandchild attempt: $two"
          if ($two -ne 'exit 9') { Write-Host 'RESULT windows-job-one-process-limit: PASS' } else { Write-Host 'RESULT windows-job-one-process-limit: FAIL' }
  macos-seatbelt-guest-shape:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: under a deny-default profile, can a process still use its own Unix socket?
        continue-on-error: true
        run: |
          set +e
          SOCK="$RUNNER_TEMP/guest.sock"
          rm -f "$SOCK"
          python3 - "$SOCK" <<'PYEOF' &
          import socket, sys, os
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.bind(sys.argv[1]); s.listen(1)
          c, _ = s.accept(); c.sendall(b"hello"); c.close()
          PYEOF
          sleep 2
          # The shape the guest needs: deny everything, allow the binary, the system libraries it
          # loads, and exactly one socket path.
          PROFILE='(version 1)
          (deny default)
          (allow process-exec*)
          (allow process-fork)
          (allow sysctl-read)
          (allow mach-lookup)
          (allow file-read-metadata)
          (allow file-read* (subpath "/usr") (subpath "/System") (subpath "/Library") (subpath "/private/var/select"))
          (allow file-read* file-write* (literal "SOCKPATH"))
          (allow network-outbound (literal "SOCKPATH"))'
          echo "${PROFILE//SOCKPATH/$SOCK}" > "$RUNNER_TEMP/guest.sb"
          cat > "$RUNNER_TEMP/client.py" <<'PYC'
          import socket, sys
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect(sys.argv[1])
          print("GOT", s.recv(16).decode())
          PYC
          sandbox-exec -f "$RUNNER_TEMP/guest.sb" /usr/bin/python3 "$RUNNER_TEMP/client.py" "$SOCK"
          boxed=$?
          echo "sandboxed client exit=$boxed"
          if [ $boxed -eq 0 ]; then echo "RESULT seatbelt-allows-its-own-socket: PASS"; else echo "RESULT seatbelt-allows-its-own-socket: FAIL"; fi
          # And the other half: the same profile must still refuse a file outside it.
          sandbox-exec -f "$RUNNER_TEMP/guest.sb" /bin/cat /etc/hosts >/dev/null 2>&1
          if [ $? -ne 0 ]; then echo "RESULT seatbelt-still-denies-other-files: PASS"; else echo "RESULT seatbelt-still-denies-other-files: FAIL"; fi

# P5 — the distribution (D-V2-42). Builds the portable toolchain archive on the four targets the
# project claims, checksums it, attests where it came from, and then INSTALLS it the way `INSTALL.md`
# says, on each target, as a gate.
#
# What it does NOT do unless the owner says so: publish. The publication target is the owner's
# decision (D-NE-7), and this is a public testing repository the owner has said is not a distribution
# channel. So a run that was not started by a `v*` tag — the dry run — builds, checks and INSTALLS the
# archive and then throws it away: nothing is uploaded, and nothing is written to the public
# attestation log, which is permanent. Only a `v*` tag (pushing one is itself the owner's act) keeps
# the archives as workflow artifacts and attests them; and a GitHub release — always a DRAFT, which a
# person publishes — is created only when the repository variable `RELEASES` is also `on`
# (Settings → Secrets and variables → Actions → Variables). It is off.
#
# Run it by hand from Actions → release → Run workflow: that is the dry run the roadmap asks for. It
# also runs weekly, so the install gate keeps being executed against a real archive rather than being
# a claim about one.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read

jobs:
  # The build, attestation and install gate on the four targets — in the reusable workflow, so the attestation names
  # it as the signer (SLSA Build Level 3, D-V2-144). The permissions it needs are granted here, by the caller.
  package:
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # A draft release, and only when the owner has switched releases on (D-NE-7).
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASES == 'on'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: One checksum file for the release
        run: cd dist && sha256sum delulu-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: A draft release — a person publishes it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --draft --verify-tag --title "DeluluLang ${GITHUB_REF_NAME}" --notes "Draft. See CHANGELOG.md; verify with sha256sum -c SHA256SUMS and gh attestation verify." -R "${GITHUB_REPOSITORY}"
